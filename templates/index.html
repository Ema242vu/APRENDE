<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeMaster Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;color:#fff;display:flex;height:100vh;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(28,176,246,.15),transparent 50%),radial-gradient(circle at 80% 90%,rgba(233,69,96,.12),transparent 50%),radial-gradient(circle at 50% 50%,#141a2e,#0a0e1a);z-index:0}
#canvas3d{position:fixed;inset:0;z-index:150;pointer-events:none}
#aqua-handle{position:fixed;width:130px;height:200px;bottom:100px;right:20px;z-index:151;cursor:grab;pointer-events:auto;touch-action:none;border-radius:50%;border:2px dashed transparent;transition:border-color .2s}
#aqua-handle.grabbing{border-color:#1cb0f6;background:rgba(28,176,246,.1)}
#aqua-handle::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(28,176,246,.35),transparent 70%);animation:pulseAura 3s infinite ease-in-out;pointer-events:none}
@keyframes pulseAura{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:.8;transform:scale(1.05)}}
#auth-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#0a0e1a,#141a2e);z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:25px}
#auth-overlay h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
#auth-overlay p.sub{color:#8b95a5;font-size:13px;margin-bottom:10px}
#auth-overlay input{width:100%;max-width:320px;padding:14px;border-radius:12px;border:2px solid #2a3a52;background:#0b0e14;color:#fff;outline:none;font-size:14px}
#auth-overlay input:focus{border-color:#1cb0f6}
#btn-login{width:100%;max-width:320px;padding:15px;border-radius:12px;border:none;background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;font-weight:800;font-size:15px;cursor:pointer;border-bottom:4px solid #0a6ea8}
#btn-register{width:100%;max-width:320px;padding:15px;border-radius:12px;border:2px solid #1cb0f6;background:transparent;color:#1cb0f6;font-weight:800;font-size:15px;cursor:pointer}
#auth-error{color:#e94560;font-size:13px;text-align:center;max-width:320px;min-height:20px}
.user-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,14,26,.95);backdrop-filter:blur(15px);border-bottom:1px solid rgba(28,176,246,.3);padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.user-bar .email{font-size:11px;color:#8b95a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;display:flex;align-items:center;gap:6px}
.user-bar .email::before{content:'👤';font-size:14px}
.logout-btn{background:linear-gradient(135deg,#e94560,#a82842);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer}
.logout-btn:active{transform:scale(.95)}
.main-content{flex:1;display:flex;flex-direction:column;align-items:center;padding:15px;padding-top:70px;overflow-y:auto;position:relative;z-index:5;padding-bottom:200px;pointer-events:auto}
.course-tabs{display:flex;width:100%;max-width:500px;gap:8px;margin-bottom:12px;background:rgba(22,33,62,.6);padding:6px;border-radius:16px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.course-tab{flex:1;padding:11px 4px;border-radius:12px;border:none;background:transparent;color:#8b95a5;font-weight:600;cursor:pointer;text-align:center;font-size:11px;transition:all .3s}
.course-tab.active-python{background:linear-gradient(135deg,#58cc02,#46a302);color:#fff;box-shadow:0 4px 15px rgba(88,204,2,.4)}
.course-tab.active-hacking{background:linear-gradient(135deg,#e94560,#c92a44);color:#fff;box-shadow:0 4px 15px rgba(233,69,96,.4)}
.course-tab.active-termux{background:linear-gradient(135deg,#00d4aa,#00a88a);color:#fff;box-shadow:0 4px 15px rgba(0,212,170,.4)}
.stats{width:100%;max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}
.stat-card{background:rgba(22,33,62,.7);padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.08);text-align:center}
.stat-label{font-size:7px;color:#8b95a5;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.stat-value{font-size:15px;font-weight:800;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.streak{background:linear-gradient(135deg,#ff6b35,#ff9a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-value.energy{background:linear-gradient(135deg,#f39c12,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.action-buttons{width:100%;max-width:500px;display:flex;gap:8px;margin-bottom:12px}
.action-btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:800;font-size:11px;cursor:pointer}
.btn-review{background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff}
.btn-achievements{background:linear-gradient(135deg,#f39c12,#c87f0a);color:#fff}
.path-container{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:10px;width:100%;max-width:400px}
.node{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:20px;font-weight:800;cursor:pointer;position:relative;transition:all .25s;border:3px solid rgba(255,255,255,.08)}
.node:nth-child(odd){transform:translateX(-50px)}
.node:nth-child(even){transform:translateX(50px)}
.node.completed{background:linear-gradient(135deg,#e94560,#a82842);color:#fff;box-shadow:0 8px 0 #5f1725}
.node.active{background:linear-gradient(135deg,#58cc02,#3a8f01);color:#fff;box-shadow:0 8px 0 #1f5201,0 0 30px rgba(88,204,2,.7);animation:bobbleOdd 1.8s infinite}
.node.active-hacking{background:linear-gradient(135deg,#e94560,#a82842);box-shadow:0 8px 0 #5f1725}
.node.active-termux{background:linear-gradient(135deg,#00d4aa,#008f70);box-shadow:0 8px 0 #004d3c}
.node.locked{background:linear-gradient(135deg,#1e2841,#131c2e);color:#4a5668;cursor:not-allowed}
.node .node-num{font-size:18px;line-height:1}
.node .node-mini{font-size:7px;opacity:.75;margin-top:2px;font-weight:600;text-align:center;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
@keyframes bobbleOdd{0%,100%{transform:scale(1) translateX(-50px)}50%{transform:scale(1.07) translateX(-50px)}}
#aqua-bubble{position:fixed;bottom:55%;right:15px;width:230px;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;padding:15px 18px;border-radius:20px;font-size:13px;font-weight:600;line-height:1.45;z-index:160;box-shadow:0 10px 30px rgba(28,176,246,.45);opacity:0;transform:translateY(15px);transition:all .35s;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
#aqua-bubble.show{opacity:1;transform:translateY(0)}
.lesson-overlay{position:fixed;inset:0;background:linear-gradient(160deg,rgba(10,14,26,.92),rgba(15,22,42,.92));backdrop-filter:blur(10px);z-index:100;display:none;flex-direction:column;padding:60px 15px 15px;box-sizing:border-box;overflow-y:auto}
.lesson-overlay.active{display:flex}
.lesson-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px;max-width:640px;margin-left:auto;margin-right:auto;width:100%}
.close-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;font-weight:bold;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lesson-progress-bg{flex:1;height:14px;background:rgba(0,0,0,.4);border-radius:10px;overflow:hidden}
.lesson-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#58cc02,#89e219);border-radius:10px;transition:width .5s}
.lesson-counter{color:#8b95a5;font-size:11px;font-weight:700;min-width:55px;text-align:right}
.lesson-content{flex:1;display:flex;flex-direction:column;gap:15px;width:100%;max-width:640px;margin:0 auto;padding-bottom:200px;padding-left:110px}
.lesson-card{background:linear-gradient(160deg,rgba(22,33,62,.96),rgba(15,22,42,.96));border-radius:22px;padding:20px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.lesson-title{color:#1cb0f6;font-size:14px;font-weight:800;text-align:center;letter-spacing:1px;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(28,176,246,.2);margin-bottom:12px}
.step-title{color:#58cc02;font-size:14px;font-weight:800;margin-bottom:8px;padding-left:8px;border-left:3px solid #58cc02}
.step-text{color:#c8d1de;font-size:13.5px;line-height:1.75;margin-bottom:14px}
.step-text code{background:rgba(0,0,0,.5);color:#58cc02;padding:2px 6px;border-radius:5px;font-family:'Courier New',monospace;font-size:12px}
.step-text pre{background:#050810;color:#89e219;padding:12px;border-radius:10px;font-family:'Courier New',monospace;font-size:11.5px;overflow-x:auto;margin:8px 0;border-left:3px solid #58cc02;line-height:1.6}
.lesson-btn{background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;border:none;border-bottom:5px solid #0a6ea8;padding:14px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;width:100%;text-transform:uppercase;margin-top:10px}
.lesson-btn:active{transform:translateY(3px);border-bottom-width:2px}
.quiz-question{color:#fff;font-size:15px;font-weight:700;line-height:1.5;margin-bottom:12px}
.quiz-option{background:rgba(30,42,50,.9);color:#fff;border:2px solid #37464f;padding:13px;border-radius:12px;text-align:left;cursor:pointer;margin-bottom:8px;font-size:13px;font-weight:600;width:100%}
.quiz-option.correct{background:linear-gradient(135deg,#4e9f3d,#3a8f01);border-color:#58cc02}
.quiz-option.wrong{background:linear-gradient(135deg,#d32f2f,#a82842);border-color:#e94560}
.quiz-option:disabled{cursor:not-allowed}
.chat-fab{position:fixed;bottom:22px;left:22px;z-index:160;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(28,176,246,.5);border:2px solid rgba(255,255,255,.2)}
.toggle-aqua{position:fixed;bottom:22px;left:90px;z-index:160;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;border:2px solid rgba(255,255,255,.15)}
.toggle-aqua.off{background:linear-gradient(135deg,#37464f,#1e2a32);opacity:.6}
.chat-input-bar{position:fixed;bottom:90px;left:22px;right:22px;z-index:160;display:none;gap:8px;align-items:center;background:linear-gradient(160deg,rgba(22,33,62,.98),rgba(15,22,42,.98));padding:10px;border-radius:28px;border:2px solid #1cb0f6}
.chat-input-bar.active{display:flex}
.chat-input-bar input{flex:1;padding:11px 16px;border-radius:22px;border:none;background:rgba(0,0,0,.5);color:#fff;outline:none;font-size:14px}
.chat-input-bar button{background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;border:none;border-radius:50%;width:42px;height:42px;display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:linear-gradient(160deg,#16213e,#0b0e14);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid #1cb0f6}
.modal-title{color:#1cb0f6;font-size:18px;font-weight:800;text-align:center;margin-bottom:15px}
.achievement{display:flex;gap:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.achievement.locked{opacity:.4}
.achievement .icon{font-size:28px}
.achievement .info h4{color:#fff;font-size:14px;margin-bottom:2px}
.achievement .info p{color:#8b95a5;font-size:11px}
.achievement.unlocked{border-color:#f39c12;box-shadow:0 0 15px rgba(243,156,18,.3)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-150px);background:linear-gradient(135deg,#f39c12,#c87f0a);color:#fff;padding:14px 22px;border-radius:15px;font-weight:800;font-size:14px;z-index:1000;box-shadow:0 10px 30px rgba(243,156,18,.5);transition:transform .4s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="aqua-handle"></div>
<div id="auth-overlay">
<h1>CodeMaster</h1>
<p class="sub">Aprende a programar con Aqua</p>
<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña (mín. 6 caracteres)">
<button id="btn-login" onclick="login()">INICIAR SESIÓN</button>
<button id="btn-register" onclick="registrar()">CREAR CUENTA</button>
<p id="auth-error"></p>
</div>
<div class="user-bar" id="user-bar" style="display:none">
<span class="email" id="user-email">...</span>
<button class="logout-btn" onclick="cerrarSesion()">SALIR</button>
</div>
<div class="lesson-overlay" id="lesson-overlay">
<div class="lesson-top-bar">
<button class="close-btn" onclick="closeLesson()">✕</button>
<div class="lesson-progress-bg"><div class="lesson-progress-fill" id="lesson-progress-fill"></div></div>
<div class="lesson-counter" id="lesson-counter">0/100</div>
</div>
<div class="lesson-content" id="lesson-content"></div>
</div>
<div class="modal" id="modal-logros">
<div class="modal-content">
<div class="modal-title">🏆 Tus Logros</div>
<div id="logros-list"></div>
<button class="lesson-btn" onclick="cerrarLogros()" style="margin-top:15px">CERRAR</button>
</div>
</div>
<div class="main-content">
<div class="course-tabs">
<button class="course-tab active-python" id="tab-python" onclick="switchCourse('python')">🐍 Python</button>
<button class="course-tab" id="tab-hacking" onclick="switchCourse('hacking')">🛡️ Hacking</button>
<button class="course-tab" id="tab-termux" onclick="switchCourse('termux')">💻 Termux</button>
</div>
<div class="stats">
<div class="stat-card"><div class="stat-label">Nivel</div><div class="stat-value" id="level">1</div></div>
<div class="stat-card"><div class="stat-label">XP</div><div class="stat-value" id="xp">0</div></div>
<div class="stat-card"><div class="stat-label">Racha</div><div class="stat-value streak" id="streak">0🔥</div></div>
<div class="stat-card"><div class="stat-label">Energía</div><div class="stat-value energy" id="energy">100</div></div>
<div class="stat-card"><div class="stat-label">Logros</div><div class="stat-value" id="logros-count">0</div></div>
</div>
<div class="action-buttons">
<button class="action-btn btn-review" onclick="repasarErrores()">🔁 Repasar (<span id="errores-count">0</span>)</button>
<button class="action-btn btn-achievements" onclick="abrirLogros()">🏆 Logros</button>
</div>
<div class="path-container" id="path-container"></div>
</div>
<div id="aqua-bubble"></div>
<div class="toast" id="toast"></div>
<div class="chat-fab" id="chat-fab" onclick="toggleChat()">💬</div>
<div class="toggle-aqua" id="toggle-aqua" onclick="toggleAqua()">👁️</div>
<div class="chat-input-bar" id="chat-input-bar">
<input type="text" id="chat-input" placeholder="Escríbele a Aqua..." onkeypress="handleChatKey(event)">
<button onclick="sendChat()">➤</button>
</div>
<script>
// FIREBASE
const firebaseConfig={apiKey:"AIzaSyCv9HVAlFaErjnncku9dFfcL1x664RCF9Q",authDomain:"aprende-97487.firebaseapp.com",projectId:"aprende-97487",storageBucket:"aprende-97487.firebasestorage.app",messagingSenderId:"678435140057",appId:"1:678435140057:web:97d9937c2cb2db330ca9c8"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

const LOGROS=[
{id:'first',name:'Primer Paso',desc:'Completa tu primera lección',icon:'👶',check:()=>totalCompletadas()>=1},
{id:'five',name:'Estudiante',desc:'Completa 5 lecciones',icon:'📚',check:()=>totalCompletadas()>=5},
{id:'twenty',name:'Dedicado',desc:'Completa 20 lecciones',icon:'🎓',check:()=>totalCompletadas()>=20},
{id:'fifty',name:'Erudito',desc:'Completa 50 lecciones',icon:'🧠',check:()=>totalCompletadas()>=50},
{id:'hundred',name:'Sabio',desc:'Completa 100 lecciones',icon:'🔮',check:()=>totalCompletadas()>=100},
{id:'streak3',name:'Constante',desc:'Racha de 3 días',icon:'🔥',check:()=>streak>=3},
{id:'streak7',name:'Imparable',desc:'Racha de 7 días',icon:'⚡',check:()=>streak>=7},
{id:'level5',name:'Nivel 5',desc:'Alcanza el nivel 5',icon:'⭐',check:()=>level>=5},
{id:'level10',name:'Nivel 10',desc:'Alcanza el nivel 10',icon:'🌟',check:()=>level>=10},
{id:'xp500',name:'500 XP',desc:'Acumula 500 XP',icon:'💎',check:()=>xp>=500},
];

const mk=(t,p,q,o,c)=>({t,p,q,o,c});

// ========== PYTHON — 20 LECCIONES DETALLADAS ==========
const PY_DETALLE=[
mk("¿Qué es Python?",[
{t:"¿Qué es un lenguaje de programación?",c:"Un lenguaje de programación es un conjunto de instrucciones que le das a una computadora. Es como darle órdenes a un perro muy obediente, pero el perro es la máquina y las órdenes son código. Python es famoso por ser <strong>fácil de leer y escribir</strong>, casi como leer inglés."},
{t:"Un poco de historia",c:"Python fue creado por <strong>Guido van Rossum</strong> en 1991. Lo llamó así no por la serpiente, sino por el grupo de comedia británico <em>Monty Python</em>. Guido quería un lenguaje divertido y fácil de usar."},
{t:"¿Por qué es tan popular?",c:"Python se usa en casi todo: <strong>Inteligencia Artificial</strong> (ChatGPT), <strong>ciencia de datos</strong>, <strong>desarrollo web</strong> (YouTube, Instagram, Spotify), <strong>automatización</strong> y hasta <strong>videojuegos</strong>."},
{t:"Tu primer comando: print()",c:"El comando más básico es <code>print()</code>, que muestra cosas en pantalla.<pre>print(\"¡Hola, mundo!\")</pre>Al ejecutar, verás: <code>¡Hola, mundo!</code>. Las comillas le dicen a Python que es texto. ¡Ya escribiste tu primer código!"}
],"¿Quién creó Python?",["Linus Torvalds","Guido van Rossum","James Gosling","Dennis Ritchie"],1),

mk("Instalar Python y tu primer archivo",[
{t:"¿Dónde escribo código?",c:"Puedes escribir Python en dos lugares:<br>1. <strong>Consola interactiva</strong>: escribes y ejecuta al instante.<br>2. <strong>Archivo .py</strong>: guardas el código y lo ejecutas completo. Esto es lo que se usa en proyectos reales."},
{t:"Cómo instalar Python",c:"En Windows/Mac descargas desde <code>python.org</code>. En Linux/Mac suele venir instalado. Verifica escribiendo <code>python --version</code> en la terminal. Si dice <code>Python 3.x.x</code>, todo bien."},
{t:"Tu primer archivo",c:"Crea un archivo llamado <code>hola.py</code> y escribe:<pre>print(\"Hola, mundo\")\nprint(\"Estoy aprendiendo Python\")</pre>Guarda y ejecuta con <code>python hola.py</code> en la terminal."},
{t:"Errores comunes al empezar",c:"• Olvidar las comillas: <code>print(Hola)</code> da error.<br>• Paréntesis faltantes: <code>print \"Hola\"</code> da error.<br>• Usar mayúsculas: Python distingue <code>print</code> de <code>Print</code>."}
],"¿Qué comando muestra texto?",["echo()","print()","log()","mostrar()"],1),

mk("Variables y asignación",[
{t:"¿Qué es una variable?",c:"Una variable es como una <strong>caja etiquetada</strong> donde guardas información. Le pones un nombre y dentro guardas un valor. Cuando la necesites, la llamas por su nombre."},
{t:"Cómo crear una variable",c:"Se crea con el signo <code>=</code> (asignación). El nombre va a la izquierda, el valor a la derecha:<pre>edad = 25\nnombre = \"Ana\"\nprecio = 19.99\nactivo = True</pre>Python guarda cada valor en su cajita."},
{t:"Reglas para nombrar variables",c:"• Deben empezar con letra o guion bajo (_).<br>• No pueden empezar con número.<br>• No pueden tener espacios (usa <code>_</code>).<br>• Sensibles a mayúsculas: <code>Edad</code> y <code>edad</code> son distintas.<br>• No uses palabras reservadas como <code>if</code>, <code>for</code>, <code>print</code>."},
{t:"Reutilizar y cambiar valores",c:"Puedes cambiar el valor de una variable cuando quieras:<pre>x = 5\nprint(x)  # 5\nx = 10\nprint(x)  # 10</pre>El valor anterior se reemplaza por el nuevo. También puedes usar el valor anterior: <code>x = x + 1</code>."}
],"¿Cómo se asigna una variable?",["x == 5","x = 5","x := 5","var x"],1),

mk("Tipos de datos básicos",[
{t:"Los 4 tipos fundamentales",c:"• <code>int</code>: números enteros (5, -3, 1000)<br>• <code>float</code>: números decimales (3.14, -0.5)<br>• <code>str</code>: cadenas de texto (\"Hola\")<br>• <code>bool</code>: verdadero o falso (True, False)"},
{t:"Detectar el tipo con type()",c:"<code>type()</code> te dice qué tipo es un valor:<pre>print(type(5))       # &lt;class 'int'&gt;\nprint(type(3.14))    # &lt;class 'float'&gt;\nprint(type(\"Hola\"))  # &lt;class 'str'&gt;\nprint(type(True))    # &lt;class 'bool'&gt;</pre>"},
{t:"¿Por qué importa el tipo?",c:"Porque no puedes sumar tipos diferentes. <code>5 + \"3\"</code> da error. Pero <code>5 + 3</code> da 8, y <code>\"5\" + \"3\"</code> da <code>\"53\"</code> (concatenación)."},
{t:"Conversión entre tipos",c:"Puedes convertir con <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code>:<pre>int(\"5\")     # 5\nfloat(3)     # 3.0\nstr(100)     # \"100\"\nbool(0)      # False\nbool(1)      # True</pre>"}
],"¿Qué tipo es 3.14?",["int","str","float","bool"],2),

mk("Operadores aritméticos",[
{t:"Operaciones básicas",c:"Python funciona como una calculadora:<br>• <code>+</code> suma: <code>5 + 3 = 8</code><br>• <code>-</code> resta: <code>5 - 3 = 2</code><br>• <code>*</code> multiplicación: <code>5 * 3 = 15</code><br>• <code>/</code> división: <code>10 / 3 = 3.333</code>"},
{t:"Operadores especiales",c:"• <code>//</code> división entera: <code>10 // 3 = 3</code> (ignora decimales)<br>• <code>%</code> módulo (resto): <code>10 % 3 = 1</code><br>• <code>**</code> potencia: <code>2 ** 3 = 8</code>"},
{t:"Orden de operaciones",c:"Python respeta el orden matemático (PEMDAS):<br>1. Paréntesis <code>()</code><br>2. Exponentes <code>**</code><br>3. Multiplicación y división <code>* / // %</code><br>4. Suma y resta <code>+ -</code><br>Ejemplo: <code>2 + 3 * 4 = 14</code>, no 20."},
{t:"Ejemplo práctico",c:"Calcula el promedio de 3 notas:<pre>n1 = 8\nn2 = 7\nn3 = 9\npromedio = (n1 + n2 + n3) / 3\nprint(promedio)  # 8.0</pre>Los paréntesis son importantes para agrupar."}
],"¿Qué da 10 % 3?",["3.33","3","1","0"],2),

mk("Strings (cadenas de texto)",[
{t:"¿Qué es un string?",c:"Es una secuencia de caracteres entre comillas. Pueden ser simples <code>'...'</code> o dobles <code>\"...\"</code>. Sirven para guardar texto: nombres, mensajes, direcciones."},
{t:"Concatenación (+)",c:"Puedes unir strings con <code>+</code>:<pre>saludo = \"Hola \" + \"Ana\"\nprint(saludo)  # Hola Ana</pre>No puedes concatenar string con número directamente. Usa <code>str()</code> para convertir."},
{t:"f-strings (la mejor forma)",c:"Las f-strings permiten meter variables dentro del texto:<pre>nombre = \"Ana\"\nedad = 25\nprint(f\"{nombre} tiene {edad} años\")\n# Ana tiene 25 años</pre>Solo pon <code>f</code> antes de las comillas y usa <code>{}</code>."},
{t:"Métodos útiles de strings",c:"<pre>\"hola\".upper()      # HOLA\n\"HOLA\".lower()      # hola\n\"hola mundo\".split() # ['hola', 'mundo']\n\"  hola  \".strip()  # hola\n\"hola\".replace(\"o\",\"a\")  # hala</pre>"}
],"¿Cómo se unen dos textos?",["&","+",".","++"],1),

mk("Entrada del usuario (input)",[
{t:"¿Qué es input()?",c:"<code>input()</code> pausa el programa y espera a que el usuario escriba algo. Cuando presiona Enter, el texto se guarda. <strong>SIEMPRE devuelve un string</strong>, aunque escribas números."},
{t:"Ejemplo básico",c:"<pre>nombre = input(\"¿Cómo te llamas? \")\nprint(f\"Hola, {nombre}!\")</pre>El texto dentro de <code>input()</code> es el mensaje que ve el usuario."},
{t:"Convertir a número",c:"Como input devuelve string, para hacer matemáticas hay que convertir:<pre>edad = int(input(\"Tu edad: \"))\nprint(f\"En 10 años tendrás {edad + 10}\")</pre>Usa <code>int()</code> para enteros y <code>float()</code> para decimales."},
{t:"Programa interactivo completo",c:"<pre>nombre = input(\"Nombre: \")\nedad = int(input(\"Edad: \"))\nprint(f\"Hola {nombre}, tienes {edad} años\")\nprint(f\"El próximo año tendrás {edad + 1}\")</pre>¡Ya hiciste tu primer programa interactivo!"}
],"¿Qué tipo devuelve input()?",["int","str","float","bool"],1),

mk("Condicionales: if",[

{t:"Sintaxis básica",c:"<pre>if edad >= 18:\n    print(\"Eres mayor de edad\")</pre>Fíjate en los <strong>dos puntos (:) al final</strong> y la <strong>indentación (4 espacios)</strong>. Python usa la indentación para saber qué código pertenece al if."},
{t:"Operadores de comparación",c:"• <code>==</code> igual a (¡doble igual!)<br>• <code>!=</code> distinto de<br>• <code>&gt;</code> mayor que<br>• <code>&lt;</code> menor que<br>• <code>&gt;=</code> mayor o igual<br>• <code>&lt;=</code> menor o igual"},
{t:"Error común",c:"Usar <code>=</code> (asignación) en lugar de <code>==</code> (comparación). <code>if x = 5</code> da error. Siempre doble igual para comparar."}
],"¿Qué inicia una condición?",["when","if","case","switch"],1),

mk("if / else",[
{t:"¿Qué es else?",c:"<code>else</code> se ejecuta cuando la condición del <code>if</code> es <strong>falsa</strong>. Es el 'si no, haz esto otro'."},
{t:"Ejemplo completo",c:"<pre>if edad >= 18:\n    print(\"Puedes votar\")\nelse:\n    print(\"No puedes votar aún\")</pre>Solo uno de los dos bloques se ejecutará."},
{t:"Anidación",c:"Puedes tener un if dentro de otro if:<pre>if nota >= 6:\n    if nota >= 9:\n        print(\"Excelente\")\n    else:\n        print(\"Aprobado\")\nelse:\n    print(\"Reprobado\")</pre>Pero es más limpio usar elif."}
],"¿Cuándo se ejecuta else?",["Siempre","Si if es False","Si if es True","Nunca"],1),

mk("elif (else if)",[

{t:"Ejemplo de calificaciones",c:"<pre>nota = 7\nif nota >= 9:\n    print(\"Excelente\")\nelif nota >= 7:\n    print(\"Bien\")\nelif nota >= 5:\n    print(\"Aprobado\")\nelse:\n    print(\"Reprobado\")</pre>Con nota=7, imprime 'Bien'."},
{t:"Orden importa",c:"Las condiciones se evalúan en orden. Si pones <code>elif nota >= 5</code> antes que <code>elif nota >= 7</code>, con nota=7 imprimiría 'Aprobado' en lugar de 'Bien'. Siempre de más específico a más general."}
],"¿Qué combina if y else?",["elseif","elif","else if","elseif"],1),

mk("Operadores lógicos",[
{t:"and (y)",c:"<code>and</code> devuelve True solo si <strong>ambas condiciones</strong> son verdaderas:<pre>if edad > 18 and tiene_id:\n    print(\"Puede entrar\")</pre>Si una falla, todo es False."},
{t:"or (o)",c:"<code>or</code> devuelve True si <strong>al menos una</strong> condición es verdadera:<pre>if es_admin or es_moderador:\n    print(\"Tiene permisos\")</pre>Con que una sea True, ya entra."},
{t:"not (no)",c:"<code>not</code> invierte el valor:<pre>if not lloviendo:\n    print(\"Salir a caminar\")</pre>Si lloviendo es False, not lloviendo es True."},
{t:"Combinando operadores",c:"<pre>if (edad > 18 or tiene_permiso) and not es_fin_de_semana:\n    print(\"Acceso concedido\")</pre>Los paréntesis agrupan y aclaran."}
],"¿Qué requiere AMBOS True?",["or","not","and","xor"],2),

mk("Bucle while",[

{t:"Sintaxis",c:"<pre>contador = 0\nwhile contador < 5:\n    print(contador)\n    contador += 1</pre>Imprime 0, 1, 2, 3, 4. <code>contador += 1</code> es clave para que el bucle termine."},
{t:"¡Cuidado con el infinito!",c:"Si la condición nunca se vuelve falsa, el bucle corre para siempre y el programa se cuelga. Siempre cambia la variable dentro del bucle."},
{t:"break y continue",c:"• <code>break</code>: sale del bucle inmediatamente.<br>• <code>continue</code>: salta a la siguiente iteración.<pre>i = 0\nwhile True:\n    if i == 3:\n        break\n    i += 1</pre>"}
],"¿Qué detiene un bucle?",["stop","break","exit","end"],1),

mk("Bucle for",[
{t:"¿Qué es for?",c:"<code>for</code> recorre elementos de una secuencia (lista, texto, rango). Es más limpio que while cuando sabes cuántas veces repetir."},

{t:"Recorrer listas y strings",c:"<pre>frutas = [\"manzana\", \"pera\", \"uva\"]\nfor fruta in frutas:\n    print(fruta)\n\nfor letra in \"Hola\":\n    print(letra)</pre>Recorre cada elemento sin necesidad de índices."},
{t:"enumerate para obtener índice",c:"Si necesitas el índice y el valor:<pre>for i, fruta in enumerate(frutas):\n    print(f\"{i}: {fruta}\")</pre>Devuelve posición y elemento juntos."}
],"¿Cuántas veces range(3)?",["2","3","4","∞"],1),

mk("range() en profundidad",[
{t:"¿Qué hace range()?",c:"Genera una secuencia de números. Se usa mucho con <code>for</code>. No crea una lista real, genera los números conforme se necesitan (es más eficiente)."},

{t:"Ejemplos prácticos",c:"<pre>for i in range(10, 0, -1):\n    print(i)  # 10, 9, 8, ... 1\n\nfor i in range(0, 10, 2):\n    print(i)  # 0, 2, 4, 6, 8</pre>El paso puede ser negativo para contar hacia atrás."}
],"¿Qué genera range(1,4)?",["1,2,3,4","1,2,3","0,1,2","2,3,4"],1),

{t:"Índices negativos",c:"Puedes acceder desde el final: <code>numeros[-1]</code> es el último (40), <code>numeros[-2]</code> es 30. Muy útil para no calcular la longitud."},

],"¿Qué índice tiene el primer elemento?",["1","0","-1","Depende"],1),

mk("Métodos de listas",[
{t:"append() - Añadir al final",c:"<pre>frutas = [\"pera\"]\nfrutas.append(\"uva\")\nprint(frutas)  # ['pera', 'uva']</pre>Añade un elemento al final de la lista."},
{t:"pop() - Eliminar el último",c:"<pre>frutas = [\"pera\", \"uva\"]\nfrutas.pop()\nprint(frutas)  # ['pera']</pre>También puedes pasar un índice: <code>pop(0)</code> elimina el primero."},

{t:"Ejemplo combinando",c:"<pre>nums = [3, 1, 4, 1, 5]\nnums.append(9)\nnums.sort()\nprint(nums)     # [1, 1, 3, 4, 5, 9]\nprint(len(nums)) # 6</pre>"}
],"¿Qué hace append?",["Elimina","Añade final","Ordena","Invierte"],1),

],"¿Inmutable significa?",["Cambia","No modifica","Rápida","Dict"],1),

],"¿Un set permite duplicados?",["Sí","No","Solo números","A veces"],1),

],"¿Qué palabra define una función?",["function","def","fun","void"],1),
];

});

const CURSOS={
python:{nombre:"Python",color:"#58cc02",color2:"#3a8f01",lecciones:PY},
hacking:{nombre:"Hacking",color:"#e94560",color2:"#a82842",lecciones:HK},
termux:{nombre:"Termux",color:"#00d4aa",color2:"#008f70",lecciones:TX}
};

let cursoActual='python';
let progreso={python:0,hacking:0,termux:0};
let xp=0,level=1,streak=0,logros=[],errores=[],energia=100;
let currentUser=null,aquaVisible=true,modoRepaso=false,ultimaRecarga=Date.now();
const COSTO_ENERGIA=10,REGEN_MS=180000;

function totalCompletadas(){return progreso.python+progreso.hacking+progreso.termux;}

auth.onAuthStateChanged((user)=>{
if(user){
currentUser=user;
document.getElementById('auth-overlay').style.display='none';
document.getElementById('user-bar').style.display='flex';
document.getElementById('user-email').innerText=user.email;
cargarDatos(user.uid);
}else{
currentUser=null;
document.getElementById('auth-overlay').style.display='flex';
document.getElementById('user-bar').style.display='none';
}
});

function registrar(){
const email=document.getElementById('email').value.trim();
const pass=document.getElementById('password').value;
const err=document.getElementById('auth-error');
err.innerText='';
if(!email||pass.length<6){err.innerText="Correo válido y contraseña 6+.";return;}
auth.createUserWithEmailAndPassword(email,pass).catch(e=>err.innerText=traducir(e.code));
}
function login(){
const email=document.getElementById('email').value.trim();
const pass=document.getElementById('password').value;
const err=document.getElementById('auth-error');
err.innerText='';
auth.signInWithEmailAndPassword(email,pass).catch(e=>err.innerText=traducir(e.code));
}
function traducir(c){
const m={'auth/email-already-in-use':'Correo ya registrado.','auth/invalid-email':'Correo inválido.','auth/weak-password':'Contraseña débil.','auth/user-not-found':'Usuario no existe.','auth/wrong-password':'Contraseña incorrecta.','auth/invalid-credential':'Datos incorrectos.'};
return m[c]||'Error: '+c;
}
function cerrarSesion(){if(confirm('¿Cerrar sesión?'))auth.signOut();}

async function guardarProgreso(){
if(!currentUser)return;
try{
await db.collection('usuarios').doc(currentUser.uid).set({email:currentUser.email,xp,level,streak,progreso,logros,errores,energia,ultimaRecarga,ultimaActividad:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
}catch(e){console.error(e);}
}

async function cargarDatos(uid){
try{
const doc=await db.collection('usuarios').doc(uid).get();
if(doc.exists){
const d=doc.data();
xp=d.xp||0;level=d.level||1;streak=d.streak||0;energia=d.energia||100;
progreso=d.progreso||{python:0,hacking:0,termux:0};
logros=d.logros||[];errores=d.errores||[];
ultimaRecarga=d.ultimaRecarga||Date.now();
if(d.ultimaActividad){
const last=d.ultimaActividad.toDate();
const hoy=new Date();
const diff=Math.floor((hoy-last)/(1000*60*60*24));
if(diff===1)streak++;
else if(diff>1)streak=1;
}else streak=1;
calcularEnergia();actualizarStats();renderPath();verificarLogros();guardarProgreso();
}else{
streak=1;energia=100;ultimaRecarga=Date.now();
await db.collection('usuarios').doc(uid).set({email:currentUser.email,xp:0,level:1,streak:1,energia:100,ultimaRecarga:Date.now(),progreso:{python:0,hacking:0,termux:0},logros:[],errores:[]});
actualizarStats();renderPath();
}
}catch(e){console.error(e);}
}

function calcularEnergia(){
const ahora=Date.now();
const transcurrido=ahora-ultimaRecarga;
const ganada=Math.floor(transcurrido/REGEN_MS);
if(ganada>0){energia=Math.min(100,energia+ganada);ultimaRecarga=ahora-((transcurrido%REGEN_MS));}
}

function actualizarStats(){
document.getElementById('xp').innerText=xp;
document.getElementById('level').innerText=level;
document.getElementById('streak').innerText=streak+'🔥';
document.getElementById('energy').innerText=energia;
document.getElementById('logros-count').innerText=logros.length;
document.getElementById('errores-count').innerText=errores.length;
}

function verificarLogros(){
LOGROS.forEach(l=>{if(!logros.includes(l.id)&&l.check()){logros.push(l.id);mostrarToast(`🏆 ¡Logro: ${l.name}!`);}});
actualizarStats();
}

function mostrarToast(txt){
const t=document.getElementById('toast');
t.innerText=txt;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),3500);
}

function abrirLogros(){
const list=document.getElementById('logros-list');
list.innerHTML='';
LOGROS.forEach(l=>{
const u=logros.includes(l.id);
list.innerHTML+=`<div class="achievement ${u?'unlocked':'locked'}"><div class="icon">${l.icon}</div><div class="info"><h4>${l.name}</h4><p>${l.desc}</p></div></div>`;
});
document.getElementById('modal-logros').classList.add('active');
}
function cerrarLogros(){document.getElementById('modal-logros').classList.remove('active');}

function repasarErrores(){
if(errores.length===0){aquaSpeak("¡Sin errores pendientes! 😏",3000);return;}
modoRepaso=true;
const e=errores[0];
abrirLeccion(e.idx,e.curso);
}

function renderPath(){
const curso=CURSOS[cursoActual];
const prog=progreso[cursoActual];
const cont=document.getElementById('path-container');
cont.innerHTML='';
curso.lecciones.forEach((l,i)=>{
const n=document.createElement('div');
n.className='node';
n.innerHTML=`<span class="node-num">${i+1}</span><span class="node-mini">${l.t.substring(0,12)}</span>`;
if(i<prog){n.classList.add('completed');n.onclick=()=>abrirLeccion(i,cursoActual);}
else if(i===prog){n.classList.add('active');if(cursoActual==='hacking')n.classList.add('active-hacking');if(cursoActual==='termux')n.classList.add('active-termux');n.onclick=()=>abrirLeccion(i,cursoActual);}
else{n.classList.add('locked');n.innerHTML='🔒';n.onclick=()=>aquaSpeak("¡Bloqueado! 😈",2000);}
cont.appendChild(n);
});
document.getElementById('tab-python').className='course-tab'+(cursoActual==='python'?' active-python':'');
document.getElementById('tab-hacking').className='course-tab'+(cursoActual==='hacking'?' active-hacking':'');
document.getElementById('tab-termux').className='course-tab'+(cursoActual==='termux'?' active-termux':'');
}

function switchCourse(c){cursoActual=c;renderPath();aquaSpeak(`¡${CURSOS[c].nombre}! 😏`,2000);}

function abrirLeccion(idx,curso){
const cursoKey=curso||cursoActual;
const lec=CURSOS[cursoKey].lecciones[idx];
if(!lec)return;
if(!modoRepaso && energia<COSTO_ENERGIA){aquaSpeak("¡Sin energía! Espera, mortal. ⚡",3000);return;}
if(!modoRepaso){energia-=COSTO_ENERGIA;actualizarStats();guardarProgreso();}
document.getElementById('lesson-overlay').classList.add('active');
moverAquaLeccion(true);
document.getElementById('lesson-counter').innerText=`${idx+1}/${CURSOS[cursoKey].lecciones.length}`;
const fill=document.getElementById('lesson-progress-fill');
fill.style.background=`linear-gradient(90deg,${CURSOS[cursoKey].color},${CURSOS[cursoKey].color2})`;
let paso=0;

function mostrarPaso(){
if(paso<lec.p.length){
const p=lec.p[paso];
document.getElementById('lesson-content').innerHTML=`<div class="lesson-card"><div class="lesson-title">📖 ${lec.t}</div><div class="step-title">${p.t}</div><div class="step-text">${p.c}</div><button class="lesson-btn" id="btn-next">SIGUIENTE ➤</button></div>`;
document.getElementById('btn-next').onclick=()=>{paso++;mostrarPaso();};
fill.style.width=((paso+1)/(lec.p.length+1)*100)+'%';
}else mostrarQuiz();
}

function mostrarQuiz(){
let html=`<div class="lesson-card"><div class="lesson-title">🧠 Pon a prueba</div><div class="quiz-question">${lec.q}</div>`;
lec.o.forEach((op,i)=>{html+=`<button class="quiz-option" data-i="${i}">${op}</button>`;});
html+=`</div>`;
document.getElementById('lesson-content').innerHTML=html;
fill.style.width='90%';
document.querySelectorAll('.quiz-option').forEach(b=>{
b.onclick=()=>{
const i=parseInt(b.dataset.i);
document.querySelectorAll('.quiz-option').forEach(x=>x.disabled=true);
if(i===lec.c){
b.classList.add('correct');
fill.style.width='100%';
errores=errores.filter(e=>!(e.idx===idx&&e.curso===cursoKey));
if(!modoRepaso && progreso[cursoKey]===idx)progreso[cursoKey]++;
xp+=15;if(xp>=100){level++;xp-=100;}
verificarLogros();guardarProgreso();actualizarStats();
setTimeout(()=>{cerrarLeccion();renderPath();aquaSpeak("¡Excelente! ✨",2000);modoRepaso=false;},1400);
}else{
b.classList.add('wrong');
document.querySelectorAll('.quiz-option')[lec.c].classList.add('correct');
if(!errores.find(e=>e.idx===idx&&e.curso===cursoKey))errores.push({idx,curso:cursoKey});
guardarProgreso();actualizarStats();
aquaSpeak("¡Ay, no! 😭",2500);
setTimeout(()=>{cerrarLeccion();modoRepaso=false;},2000);
}
};
});
}
mostrarPaso();
}

function cerrarLeccion(){document.getElementById('lesson-overlay').classList.remove('active');moverAquaLeccion(false);}

const aquaBubble=document.getElementById('aqua-bubble');
function aquaSpeak(text,dur=3000){
if(!aquaVisible)return;
aquaBubble.innerText=text;
aquaBubble.classList.add('show');
clearTimeout(window.bT);
window.bT=setTimeout(()=>aquaBubble.classList.remove('show'),dur);
const s=window.speechSynthesis;
const u=new SpeechSynthesisUtterance(text);
u.lang='es-ES';u.rate=1.0;u.pitch=1.4;s.cancel();s.speak(u);
}
function toggleAqua(){
aquaVisible=!aquaVisible;
document.getElementById('canvas3d').style.opacity=aquaVisible?'1':'0';
document.getElementById('aqua-handle').style.display=aquaVisible?'block':'none';
aquaBubble.classList.remove('show');
const t=document.getElementById('toggle-aqua');
t.classList.toggle('off',!aquaVisible);
t.innerText=aquaVisible?'👁️':'🚫';
}

let dragging=false,sX=0,sY=0,sL=0,sT=0;
const aquaHandle=document.getElementById('aqua-handle');
aquaHandle.addEventListener('pointerdown',e=>{
dragging=true;
const r=aquaHandle.getBoundingClientRect();
sX=e.clientX;sY=e.clientY;sL=r.left;sT=r.top;
aquaHandle.classList.add('grabbing');
e.preventDefault();
});
document.addEventListener('pointermove',e=>{
if(!dragging)return;
const dx=e.clientX-sX,dy=e.clientY-sY;
const newL=Math.max(0,Math.min(window.innerWidth-130,sL+dx));
const newT=Math.max(0,Math.min(window.innerHeight-200,sT+dy));
aquaHandle.style.left=newL+'px';aquaHandle.style.top=newT+'px';
aquaHandle.style.right='auto';aquaHandle.style.bottom='auto';
updateAqua3D(newL+65,newT+100);
e.preventDefault();
});
document.addEventListener('pointerup',()=>{dragging=false;aquaHandle.classList.remove('grabbing');});

function updateAqua3D(px,py){
if(!modelo3D)return;
const scale=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;
modelo3D.position.x=(px-window.innerWidth/2)*scale;
modelo3D.position.y=-(py-window.innerHeight/2)*scale+1.0;
aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;
}

function moverAquaLeccion(activo){
if(!modelo3D)return;
if(activo){
const scale=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;
const px=80,py=window.innerHeight*0.55;
modelo3D.position.x=(px-window.innerWidth/2)*scale;
modelo3D.position.y=-(py-window.innerHeight/2)*scale+1.0;
aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;
modelo3D.scale.set(1.6,1.6,1.6);
}else{
const r=aquaHandle.getBoundingClientRect();
updateAqua3D(r.left+65,r.top+100);
modelo3D.scale.set(1.3,1.3,1.3);
}
}

function toggleChat(){
const b=document.getElementById('chat-input-bar');
const f=document.getElementById('chat-fab');
b.classList.toggle('active');
f.classList.toggle('active');
f.innerText=b.classList.contains('active')?'✕':'💬';
}
function handleChatKey(e){if(e.key==='Enter')sendChat();}
async function sendChat(){
const i=document.getElementById('chat-input');
const t=i.value.trim();
if(!t)return;
i.value='';
aquaSpeak('...',1500);
try{
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:t})});
const d=await r.json();
aquaSpeak(d.respuesta,5000);
}catch(e){aquaSpeak("Error de conexión, mortal.",3000);}
}

const canvas=document.getElementById('canvas3d');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1,8);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0xffffff,.9));
const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(2,5,5);scene.add(dl);
const bl=new THREE.PointLight(0x1cb0f6,2,12);bl.position.set(-2,1,2);scene.add(bl);
const pk=new THREE.PointLight(0xe94560,1,12);pk.position.set(2,0,2);scene.add(pk);

let modelo3D,aquaBaseX=0,aquaBaseY=0;
new THREE.GLTFLoader().load('/static/aqua__anime_chibi_model.glb',g=>{
modelo3D=g.scene;
modelo3D.scale.set(1.3,1.3,1.3);
const r=aquaHandle.getBoundingClientRect();
updateAqua3D(r.left+65,r.top+100);
scene.add(modelo3D);
});

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
if(modelo3D&&!dragging){modelo3D.position.y=aquaBaseY+Math.sin(clock.getElapsedTime()*2)*.05;}
renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

setInterval(()=>{calcularEnergia();actualizarStats();},30000);
renderPath();
setTimeout(()=>aquaSpeak("¡Bienvenido! 😏",4000),1000);
</script>
</body>
</html>
