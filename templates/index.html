<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeMaster Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;color:#fff;display:flex;height:100vh;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(28,176,246,.15),transparent 50%),radial-gradient(circle at 80% 90%,rgba(233,69,96,.12),transparent 50%),radial-gradient(circle at 50% 50%,#141a2e,#0a0e1a);z-index:0}

#canvas3d{position:fixed;inset:0;z-index:1;pointer-events:none}
#aqua-handle{position:fixed;width:130px;height:200px;bottom:70px;right:30px;z-index:2;cursor:grab;pointer-events:auto;touch-action:none;border-radius:50%}
#aqua-handle::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(28,176,246,.25),transparent 70%);animation:pulseAura 3s infinite ease-in-out;pointer-events:none}
@keyframes pulseAura{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:.8;transform:scale(1.05)}}

.main-content{flex:1;display:flex;flex-direction:column;align-items:center;padding:15px;overflow-y:auto;position:relative;z-index:5;padding-bottom:180px;pointer-events:auto}

.course-tabs{display:flex;width:100%;max-width:480px;gap:8px;margin-bottom:15px;background:rgba(22,33,62,.6);padding:6px;border-radius:16px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.course-tab{flex:1;padding:11px 8px;border-radius:12px;border:none;background:transparent;color:#8b95a5;font-weight:600;cursor:pointer;text-align:center;font-size:12px;transition:all .3s}
.course-tab.active-python{background:linear-gradient(135deg,#58cc02,#46a302);color:#fff;box-shadow:0 4px 15px rgba(88,204,2,.4)}
.course-tab.active-hacking{background:linear-gradient(135deg,#e94560,#c92a44);color:#fff;box-shadow:0 4px 15px rgba(233,69,96,.4)}
.course-tab.active-termux{background:linear-gradient(135deg,#00d4aa,#00a88a);color:#fff;box-shadow:0 4px 15px rgba(0,212,170,.4)}

.stats{width:100%;max-width:480px;display:flex;justify-content:space-between;gap:8px;margin-bottom:18px}
.stat-card{flex:1;background:rgba(22,33,62,.7);padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);text-align:center}
.stat-label{font-size:9px;color:#8b95a5;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.stat-value{font-size:18px;font-weight:800;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.path-container{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:10px;width:100%;max-width:380px}
.node{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:22px;font-weight:800;cursor:pointer;position:relative;transition:all .25s cubic-bezier(.34,1.56,.64,1);border:3px solid rgba(255,255,255,.08)}
.node:nth-child(odd){transform:translateX(-50px)}
.node:nth-child(even){transform:translateX(50px)}
.node.completed{background:linear-gradient(135deg,#e94560,#a82842);color:#fff;box-shadow:0 8px 0 #5f1725,0 0 25px rgba(233,69,96,.5)}
.node.active{background:linear-gradient(135deg,#58cc02,#3a8f01);color:#fff;box-shadow:0 8px 0 #1f5201,0 0 30px rgba(88,204,2,.7);animation:bobble 1.8s infinite ease-in-out}
.node.active-hacking{background:linear-gradient(135deg,#e94560,#a82842);box-shadow:0 8px 0 #5f1725,0 0 30px rgba(233,69,96,.7)}
.node.active-termux{background:linear-gradient(135deg,#00d4aa,#008f70);box-shadow:0 8px 0 #004d3c,0 0 30px rgba(0,212,170,.7)}
.node.locked{background:linear-gradient(135deg,#1e2841,#131c2e);color:#4a5668;cursor:not-allowed;border-color:rgba(255,255,255,.03);box-shadow:0 6px 0 #080c18}
.node:hover:not(.locked){transform:translateX(0) scale(1.08) !important;filter:brightness(1.15)}
.node .node-num{font-size:22px;line-height:1}
.node .node-mini{font-size:8px;opacity:.75;margin-top:2px;font-weight:600;letter-spacing:.5px}
.node.active .node-mini,.node.completed .node-mini{color:rgba(255,255,255,.9)}
@keyframes bobble{0%,100%{transform:scale(1) translateX(0)}50%{transform:scale(1.07) translateX(0)}}
.node.active:nth-child(odd){animation:bobbleOdd 1.8s infinite}
.node.active:nth-child(even){animation:bobbleEven 1.8s infinite}
@keyframes bobbleOdd{0%,100%{transform:scale(1) translateX(-50px)}50%{transform:scale(1.07) translateX(-50px)}}
@keyframes bobbleEven{0%,100%{transform:scale(1) translateX(50px)}50%{transform:scale(1.07) translateX(50px)}}

/* Burbuja */
#aqua-bubble{position:fixed;bottom:52%;right:15px;width:230px;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;padding:15px 18px;border-radius:20px;font-size:13px;font-weight:600;line-height:1.45;z-index:8;box-shadow:0 10px 30px rgba(28,176,246,.45),inset 0 1px 0 rgba(255,255,255,.25);opacity:0;transform:translateY(15px) scale(.95);transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;border:1px solid rgba(255,255,255,.15)}
#aqua-bubble::after{content:'';position:absolute;bottom:-13px;right:55px;border:12px solid transparent;border-top-color:#0d7bc4;border-bottom:0}
#aqua-bubble.show{opacity:1;transform:translateY(0) scale(1)}

/* Overlay de lección */
.lesson-overlay{position:fixed;inset:0;background:linear-gradient(160deg,rgba(10,14,26,.97),rgba(15,22,42,.97));backdrop-filter:blur(14px);z-index:20;display:none;flex-direction:column;padding:15px;box-sizing:border-box;overflow-y:auto}
.lesson-overlay.active{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.lesson-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px;max-width:640px;margin-left:auto;margin-right:auto;width:100%}
.close-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;font-weight:bold;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.close-btn:hover{background:rgba(255,255,255,.15)}
.lesson-progress-bg{flex:1;height:14px;background:rgba(0,0,0,.4);border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.lesson-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#58cc02,#89e219);border-radius:10px;transition:width .5s ease;box-shadow:0 0 12px rgba(88,204,2,.6)}
.lesson-counter{color:#8b95a5;font-size:11px;font-weight:700;letter-spacing:1px;min-width:45px;text-align:right}

.lesson-content{flex:1;display:flex;flex-direction:column;gap:15px;width:100%;max-width:640px;margin:0 auto;padding-bottom:20px}
.lesson-card{background:linear-gradient(160deg,rgba(22,33,62,.95),rgba(15,22,42,.95));border-radius:22px;padding:22px;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);display:flex;flex-direction:column;gap:14px;animation:slideUp .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.lesson-title{color:#1cb0f6;font-size:15px;font-weight:800;text-align:center;letter-spacing:1px;text-transform:uppercase;padding-bottom:12px;border-bottom:1px solid rgba(28,176,246,.2);text-shadow:0 0 20px rgba(28,176,246,.5)}

.step-title{color:#58cc02;font-size:15px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.step-title::before{content:'';width:4px;height:18px;background:linear-gradient(180deg,#58cc02,#3a8f01);border-radius:2px}
.step-text{color:#c8d1de;font-size:14px;line-height:1.7}
.step-text code{background:rgba(0,0,0,.5);color:#58cc02;padding:2px 7px;border-radius:5px;font-family:'Courier New',monospace;font-size:13px;border:1px solid rgba(88,204,2,.2)}
.step-text pre{background:#050810;color:#89e219;padding:14px;border-radius:12px;font-family:'Courier New',monospace;font-size:12.5px;overflow-x:auto;margin:10px 0;border-left:3px solid #58cc02;line-height:1.6;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.step-text strong{color:#fff;font-weight:700}

.lesson-btn{background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;border:none;border-bottom:5px solid #0a6ea8;padding:16px;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:1px;transition:all .1s;margin-top:8px;box-shadow:0 8px 20px rgba(28,176,246,.3)}
.lesson-btn:active{transform:translateY(3px);border-bottom-width:2px}

.quiz-question{color:#fff;font-size:16px;font-weight:700;line-height:1.5;margin-bottom:15px}
.quiz-option{background:rgba(30,42,50,.9);color:#fff;border:2px solid #37464f;padding:15px;border-radius:14px;text-align:left;cursor:pointer;margin-bottom:10px;font-size:14px;font-weight:600;transition:all .15s;width:100%}
.quiz-option:hover:not(:disabled){background:rgba(28,176,246,.15);border-color:#1cb0f6;transform:translateX(4px)}
.quiz-option.correct{background:linear-gradient(135deg,#4e9f3d,#3a8f01);border-color:#58cc02;color:#fff;box-shadow:0 0 20px rgba(88,204,2,.5)}
.quiz-option.wrong{background:linear-gradient(135deg,#d32f2f,#a82842);border-color:#e94560;color:#fff}
.quiz-option:disabled{cursor:not-allowed}

/* Chat */
.chat-fab{position:fixed;bottom:22px;left:22px;z-index:30;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(28,176,246,.5),inset 0 1px 0 rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.2);transition:all .25s}
.chat-fab:hover{transform:scale(1.1) rotate(-5deg)}
.chat-fab.active{background:linear-gradient(135deg,#e94560,#a82842)}

/* Botón toggle Aqua */
.toggle-aqua{position:fixed;bottom:22px;left:90px;z-index:30;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;box-shadow:0 6px 20px rgba(83,52,131,.5);border:2px solid rgba(255,255,255,.15);transition:all .25s}
.toggle-aqua:hover{transform:scale(1.1)}
.toggle-aqua.off{background:linear-gradient(135deg,#37464f,#1e2a32);opacity:.6}

.chat-input-bar{position:fixed;bottom:90px;left:22px;right:22px;z-index:30;display:none;gap:8px;align-items:center;background:linear-gradient(160deg,rgba(22,33,62,.98),rgba(15,22,42,.98));padding:10px;border-radius:28px;border:2px solid #1cb0f6;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.chat-input-bar.active{display:flex;animation:slideUp .3s}
.chat-input-bar input{flex:1;padding:11px 16px;border-radius:22px;border:none;background:rgba(0,0,0,.5);color:#fff;outline:none;font-size:14px}
.chat-input-bar input::placeholder{color:#4a5668}
.chat-input-bar button{background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;border:none;border-radius:50%;width:42px;height:42px;display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .2s}
.chat-input-bar button:active{transform:scale(.92)}
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>
<div id="aqua-handle"></div>

<div class="lesson-overlay" id="lesson-overlay">
<div class="lesson-top-bar">
<button class="close-btn" onclick="closeLesson()">✕</button>
<div class="lesson-progress-bg"><div class="lesson-progress-fill" id="lesson-progress-fill"></div></div>
<div class="lesson-counter" id="lesson-counter">0/40</div>
</div>
<div class="lesson-content" id="lesson-content"></div>
</div>

<div class="main-content">
<div class="course-tabs">
<button class="course-tab active-python" id="tab-python" onclick="switchCourse('python')">🐍 Python</button>
<button class="course-tab" id="tab-hacking" onclick="switchCourse('hacking')">🛡️ Hacking</button>
<button class="course-tab" id="tab-termux" onclick="switchCourse('termux')">💻 Termux</button>
</div>
<div class="stats">
<div class="stat-card"><div class="stat-label">Nivel</div><div class="stat-value" id="level">1</div></div>
<div class="stat-card"><div class="stat-label">XP</div><div class="stat-value" id="xp">0</div></div>
<div class="stat-card"><div class="stat-label">Progreso</div><div class="stat-value" id="progress-pct">0%</div></div>
</div>
<div class="path-container" id="path-container"></div>
</div>

<div id="aqua-bubble"></div>

<div class="chat-fab" id="chat-fab" onclick="toggleChat()">💬</div>
<div class="toggle-aqua" id="toggle-aqua" onclick="toggleAqua()" title="Mostrar/Ocultar Aqua">👁️</div>
<div class="chat-input-bar" id="chat-input-bar">
<input type="text" id="chat-input" placeholder="Escríbele a Aqua..." onkeypress="handleChatKey(event)">
<button onclick="sendChat()">➤</button>
</div>

<script>
// ==========================================
// DATOS: 3 CURSOS x 40 LECCIONES
// ==========================================
const mk=(t,p,q,o,c)=>({t,p,q,o,c});

const CURSOS = {
python:{nombre:"Python",icono:"🐍",color:"#58cc02",color2:"#3a8f01",clase:"active-python",lecciones:[
mk("¿Qué es Python?",[{t:"Definición",c:"Python es un lenguaje <strong>interpretado</strong>, de alto nivel y fácil de leer. Creado por Guido van Rossum en 1991."},{t:"¿Por qué es popular?",c:"Se usa en IA, ciencia de datos, desarrollo web y automatización. Su sintaxis se parece al inglés."}],"¿Quién creó Python?",["Linus Torvalds","Guido van Rossum","James Gosling","Dennis Ritchie"],1),
mk("Tu primer programa",[{t:"El comando print",c:"Muestra texto en pantalla: <code>print(\"Hola, mundo\")</code>"},{t:"¿Dónde escribirlo?",c:"Puedes usar la consola de Python o guardarlo en un archivo <code>.py</code> y ejecutarlo."}],"¿Qué comando muestra texto?",["echo()","print()","console.log()","mostrar()"],1),
mk("Variables",[{t:"¿Qué es una variable?",c:"Una caja donde guardas un valor. Se asigna con <code>=</code>."},{t:"Ejemplo",c:"<pre>edad = 25\nnombre = \"Ana\"</pre>"}],"¿Cómo se asigna una variable?",["edad == 25","edad = 25","edad := 25","var edad = 25"],1),
mk("Tipos de datos",[{t:"Básicos",c:"<code>int</code> enteros, <code>float</code> decimales, <code>str</code> texto, <code>bool</code> True/False."},{t:"Detectar el tipo",c:"Usa <code>type(valor)</code> para saber de qué tipo es."}],"¿Qué tipo es 3.14?",["int","str","float","bool"],2),
mk("Operadores aritméticos",[{t:"Básicos",c:"<code>+ - * /</code> suma, resta, multiplicación, división."},{t:"Especiales",c:"<code>//</code> división entera, <code>%</code> módulo, <code>**</code> potencia."}],"¿Qué da 10 % 3?",["3.33","3","1","0"],2),
mk("Strings (cadenas)",[{t:"Definición",c:"Texto entre comillas: <code>\"Hola\"</code> o <code>'Mundo'</code>"},{t:"Concatenar",c:"Une textos con <code>+</code>. Con f-strings: <code>f\"Hola {nombre}\"</code>"}],"¿Cómo unir texto y variable?",["texto1 & v","texto1 + v","texto1.v","texto1 ++ v"],1),
mk("Input del usuario",[{t:"input()",c:"Pide datos al usuario. Siempre devuelve un <strong>string</strong>."},{t:"Convertir",c:"<pre>edad = int(input(\"Edad: \"))</pre>"}],"¿Qué tipo devuelve input()?",["int","str","float","bool"],1),
mk("Conversión de tipos",[{t:"Convertir",c:"<code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code>"},{t:"Ejemplo",c:"<pre>n = int(\"5\") + 3  # 8</pre>"}],"¿Cómo convertir \"5\" a entero?",["string(5)","int(\"5\")","float(5)","str(5)"],1),
mk("Condicional if",[{t:"if",c:"Ejecuta código si la condición es True: <pre>if edad >= 18:\n    print(\"Mayor\")</pre>"},{t:"Importante",c:"La indentación (4 espacios) es obligatoria en Python."}],"¿Qué palabra inicia una condición?",["when","if","case","switch"],1),
mk("if/else",[{t:"else",c:"Se ejecuta cuando la condición es False: <pre>if x>0:\n    print(\"Positivo\")\nelse:\n    print(\"No positivo\")</pre>"},{t:"Anidación",c:"Puedes anidar varios if dentro de otros."}],"¿Cuándo se ejecuta else?",["Siempre","Si el if es False","Si el if es True","Nunca"],1),
mk("elif",[{t:"Múltiples condiciones",c:"<pre>if nota>=9:\n    print(\"A\")\nelif nota>=6:\n    print(\"B\")\nelse:\n    print(\"F\")</pre>"},{t:"Orden",c:"Python evalúa de arriba a abajo y para al primer True."}],"¿Qué palabra combina if y else?",["elseif","elif","else if","elseif"],1),
mk("Operadores lógicos",[{t:"and, or, not",c:"<code>and</code>: ambos True<br><code>or</code>: al menos uno<br><code>not</code>: invierte"}],"¿Cuál requiere AMBAS condiciones True?",["or","not","and","xor"],2),
mk("Bucle while",[{t:"While",c:"Repite mientras la condición sea True: <pre>i=0\nwhile i<5:\n    print(i)\n    i+=1</pre>"},{t:"Cuidado",c:"Si no cambias la variable, el bucle es infinito."}],"¿Qué palabra detiene un bucle?",["stop","break","exit","end"],1),
mk("Bucle for",[{t:"for",c:"Recorre secuencias: <pre>for i in range(5):\n    print(i)</pre>"},{t:"Sobre listas",c:"<pre>for fruta in [\"pera\",\"uva\"]:\n    print(fruta)</pre>"}],"¿Cuántas veces se ejecuta range(3)?",["2","3","4","∞"],1),
mk("range()",[{t:"range",c:"<code>range(fin)</code>, <code>range(inicio,fin)</code>, <code>range(inicio,fin,paso)</code>"},{t:"Ejemplo",c:"<code>range(1,10,2)</code> → 1,3,5,7,9"}],"¿Qué genera range(1,4)?",["1,2,3,4","1,2,3","0,1,2,3","2,3,4"],1),
mk("Listas",[{t:"Definición",c:"Colección ordenada: <code>[1,2,3]</code>. Índices desde 0."},{t:"Modificar",c:"<code>lista[0]=99</code>"}],"¿Qué índice tiene el primer elemento?",["1","0","-1","Depende"],1),
mk("Métodos de listas",[{t:"Útiles",c:"<code>append(x)</code>, <code>pop()</code>, <code>remove(x)</code>, <code>len(lista)</code>"},{t:"Ejemplo",c:"<pre>nums=[1,2]\nnums.append(3)  # [1,2,3]</pre>"}],"¿Qué hace append?",["Elimina","Añade al final","Ordena","Invierte"],1),
mk("Tuplas",[{t:"Definición",c:"Como listas pero <strong>inmutables</strong>: <code>(1,2,3)</code>"},{t:"Ventaja",c:"Más rápidas y seguras para datos que no cambian."}],"¿Qué significa que una tupla es inmutable?",["Cambia sola","No se puede modificar","Es más rápida","Es un diccionario"],1),
mk("Sets (conjuntos)",[{t:"Definición",c:"No permiten duplicados: <code>{1,2,3}</code>"},{t:"Útil para",c:"Eliminar duplicados de una lista: <code>set([1,1,2])</code> → {1,2}"}],"¿Un set permite duplicados?",["Sí","No","Solo números","A veces"],1),
mk("Diccionarios",[{t:"Definición",c:"Pares clave-valor: <code>{\"nombre\":\"Ana\"}</code>"},{t:"Acceder",c:"<code>dic[\"nombre\"]</code> o <code>dic.get(\"nombre\")</code>"}],"¿Cómo acceder a un valor?",["dic.nombre","dic->nombre","dic[\"nombre\"]","dic(nombre)"],2),
mk("Métodos de dict",[{t:"Útiles",c:"<code>.keys()</code>, <code>.values()</code>, <code>.items()</code>, <code>.get()</code>"},{t:"Ejemplo",c:"<pre>for k,v in dic.items():\n    print(k,v)</pre>"}],"¿Qué devuelve .keys()?",["Valores","Pares","Claves","Tamaño"],2),
mk("Funciones",[{t:"def",c:"Bloque reutilizable: <pre>def saludar():\n    print(\"Hola\")\nsaludar()</pre>"},{t:"Ventaja",c:"Evitas repetir código y lo haces más legible."}],"¿Qué palabra define una función?",["function","def","fun","void"],1),
mk("Parámetros y return",[{t:"Parámetros",c:"<pre>def sumar(a,b):\n    return a+b</pre>"},{t:"return vs print",c:"<code>return</code> devuelve el valor; <code>print</code> solo muestra."}],"¿Qué palabra devuelve un valor?",["print","return","give","send"],1),
mk("Scope de variables",[{t:"Local vs Global",c:"Variables dentro de funciones son locales. Las globales se definen fuera."},{t:"global",c:"Para modificar una global dentro de una función usa <code>global var</code>."}],"¿Dónde vive una variable local?",["En todo el programa","Solo dentro de la función","En el módulo","En el sistema"],1),

  const prog=progreso[cursoActual];
  pathContainer.innerHTML='';
  curso.lecciones.forEach((l,i)=>{
    const n=document.createElement('div');
    n.className='node';
    n.innerHTML=`<span class="node-num">${i+1}</span><span class="node-mini">${l.t.substring(0,10)}</span>`;
    if(i<prog){n.classList.add('completed');n.onclick=()=>abrirLeccion(i);}
    else if(i===prog){n.classList.add('active');if(cursoActual==='hacking')n.classList.add('active-hacking');if(cursoActual==='termux')n.classList.add('active-termux');n.onclick=()=>abrirLeccion(i);}
    else{n.classList.add('locked');n.innerHTML='🔒';n.onclick=()=>aquaSpeak("¡Bloqueado! Termina las anteriores. 😈",2500);}
    pathContainer.appendChild(n);
  });
  document.getElementById('tab-python').className='course-tab'+(cursoActual==='python'?' active-python':'');
  document.getElementById('tab-hacking').className='course-tab'+(cursoActual==='hacking'?' active-hacking':'');
  document.getElementById('tab-termux').className='course-tab'+(cursoActual==='termux'?' active-termux':'');
  const pct=Math.round((prog/curso.lecciones.length)*100);
  document.getElementById('progress-pct').innerText=pct+'%';
}

function switchCourse(c){
  cursoActual=c;
  renderPath();
  aquaSpeak(`¡Curso de ${CURSOS[c].nombre}! Vamos. 😏`,2500);
}

// ==========================================
// LECCIONES
// ==========================================
function abrirLeccion(idx){
  const lec=CURSOS[cursoActual].lecciones[idx];
  lessonOverlay.classList.add('active');
  lessonCounter.innerText=`${idx+1}/${CURSOS[cursoActual].lecciones.length}`;
  lessonProgressFill.style.background=`linear-gradient(90deg,${CURSOS[cursoActual].color},${CURSOS[cursoActual].color2})`;
  let paso=0;

  function pasoMostrar(){
    if(paso<lec.p.length){
      const p=lec.p[paso];
      lessonContent.innerHTML=`<div class="lesson-card">
        <div class="lesson-title">📖 ${lec.t}</div>
        <div class="step-title">${p.t}</div>
        <div class="step-text">${p.c}</div>
        <button class="lesson-btn" id="btn-next">SIGUIENTE ➤</button>
      </div>`;
      document.getElementById('btn-next').onclick=()=>{paso++;pasoMostrar();};
      lessonProgressFill.style.width=((paso+1)/(lec.p.length+1)*100)+'%';
    } else mostrarQuiz();
  }

  function mostrarQuiz(){
    let html=`<div class="lesson-card">
      <div class="lesson-title">🧠 Pon a prueba</div>
      <div class="quiz-question">${lec.q}</div>`;
    lec.o.forEach((op,i)=>{html+=`<button class="quiz-option" data-i="${i}">${op}</button>`;});
    html+=`</div>`;
    lessonContent.innerHTML=html;
    lessonProgressFill.style.width='90%';
    document.querySelectorAll('.quiz-option').forEach(b=>{
      b.onclick=()=>{
        const i=parseInt(b.dataset.i);
        document.querySelectorAll('.quiz-option').forEach(x=>x.disabled=true);
        if(i===lec.c){
          b.classList.add('correct');
          lessonProgressFill.style.width='100%';
          addXP(15);
          if(progreso[cursoActual]===idx)progreso[cursoActual]++;
          setTimeout(()=>{cerrarLeccion();renderPath();aquaSpeak("¡Excelente! ✨",2500);},1400);
        } else {
          b.classList.add('wrong');
          document.querySelectorAll('.quiz-option')[lec.c].classList.add('correct');
          aquaSpeak("¡Ay, no! ¡Estudia más! 😭",3000);
          setTimeout(()=>cerrarLeccion(),2200);
        }
      };
    });
  }
  pasoMostrar();
}
function cerrarLeccion(){lessonOverlay.classList.remove('active');}

function addXP(n){
  xp+=n;
  document.getElementById('xp').innerText=xp;
  if(xp>=100){level++;xp-=100;document.getElementById('level').innerText=level;}
}

// ==========================================
// AQUA
// ==========================================
function aquaSpeak(text,dur=3000){
  if(!aquaVisible)return;
  aquaBubble.innerText=text;
  aquaBubble.classList.add('show');
  clearTimeout(window.bT);
  window.bT=setTimeout(()=>aquaBubble.classList.remove('show'),dur);
  const s=window.speechSynthesis;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-ES';u.rate=1.0;u.pitch=1.4;s.cancel();s.speak(u);
}

// Toggle Aqua
function toggleAqua(){
  aquaVisible=!aquaVisible;
  const c=document.getElementById('canvas3d');
  const h=document.getElementById('aqua-handle');
  const t=document.getElementById('toggle-aqua');
  c.style.opacity=aquaVisible?'1':'0';
  h.style.display=aquaVisible?'block':'none';
  aquaBubble.classList.remove('show');
  t.classList.toggle('off',!aquaVisible);
  t.innerText=aquaVisible?'👁️':'🚫';
}

// ==========================================
// DRAG AQUA
// ==========================================
let dragging=false,startX=0,startY=0,startL=0,startT=0;
aquaHandle.addEventListener('pointerdown',e=>{
  dragging=true;
  const r=aquaHandle.getBoundingClientRect();
  startX=e.clientX;startY=e.clientY;startL=r.left;startT=r.top;
  aquaHandle.style.cursor='grabbing';
  aquaHandle.setPointerCapture(e.pointerId);
});
aquaHandle.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-startX,dy=e.clientY-startY;
  const w=window.innerWidth,h=window.innerHeight;
  const newL=Math.max(0,Math.min(w-130,startL+dx));
  const newT=Math.max(0,Math.min(h-200,startT+dy));
  aquaHandle.style.left=newL+'px';
  aquaHandle.style.top=newT+'px';
  aquaHandle.style.right='auto';
  aquaHandle.style.bottom='auto';
  updateAqua3D(newL+65,newT+100);
});
aquaHandle.addEventListener('pointerup',e=>{dragging=false;aquaHandle.style.cursor='grab';});

function updateAqua3D(px,py){
  if(!modelo3D)return;
  const w=window.innerWidth,h=window.innerHeight;
  const scale=(8*Math.tan(Math.PI/8)*2)/h;
  const wx=(px-w/2)*scale;
  const wy=-(py-h/2)*scale+1.0;
  modelo3D.position.x=wx;
  modelo3D.position.y=wy;
  aquaBaseX=wx;aquaBaseY=wy;
}

// ==========================================
// CHAT
// ==========================================
function toggleChat(){
  const b=document.getElementById('chat-input-bar');
  const f=document.getElementById('chat-fab');
  b.classList.toggle('active');
  f.classList.toggle('active');
  if(b.classList.contains('active')){document.getElementById('chat-input').focus();f.innerText='✕';}
  else f.innerText='💬';
}
function handleChatKey(e){if(e.key==='Enter')sendChat();}
function sendChat(){
  const i=document.getElementById('chat-input');
  const t=i.value.trim();
  if(!t)return;
  i.value='';
  const rs=[
    "¡Mmm! ¿Eso es una pregunta para una diosa? Estudia mejor. 😏",
    "¡Kazuma! Digo... ¡tú! Concéntrate.",
    "Buena pregunta, pero está en las lecciones.",
    "¡Soy una diosa, no una enciclopedia!",
    "¡No me molestes mientras descanso, mortal!"
  ];
  aquaSpeak(rs[Math.floor(Math.random()*rs.length)],3500);
}

// ==========================================
// THREE.JS
// ==========================================
const canvas=document.getElementById('canvas3d');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1,8);

const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

scene.add(new THREE.AmbientLight(0xffffff,.9));
const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(2,5,5);scene.add(d);
const blue=new THREE.PointLight(0x1cb0f6,2,12);blue.position.set(-2,1,2);scene.add(blue);
const pink=new THREE.PointLight(0xe94560,1,12);pink.position.set(2,0,2);scene.add(pink);

let modelo3D,aquaBaseX=0,aquaBaseY=0;
const loader=new THREE.GLTFLoader();
loader.load('/static/aqua__anime_chibi_model.glb',g=>{
  modelo3D=g.scene;
  modelo3D.scale.set(1.3,1.3,1.3);
  const r=aquaHandle.getBoundingClientRect();
  updateAqua3D(r.left+65,r.top+100);
  scene.add(modelo3D);
},undefined,e=>console.error(e));

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(modelo3D&&!dragging){
    modelo3D.position.y=aquaBaseY+Math.sin(clock.getElapsedTime()*2)*.05;
  }
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ==========================================
// INIT
// ==========================================
renderPath();
setTimeout(()=>aquaSpeak("¡Bienvenido! Elige un curso y empieza. 😏",4000),800);
</script>
