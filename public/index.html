<style>

body{background:#0a0e1a;color:#fff;display:flex;height:100vh;overflow:hidden;position:relative}

.lesson-btn{background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;border:none;border-bottom:5px solid #0a6ea8;padding:14px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;width:100%;text-transform:uppercase;margin-top:10px}
.lesson-btn:active{transform:translateY(3px);border-bottom-width:2px}

.chat-fab{position:fixed;bottom:22px;left:22px;z-index:160;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(28,176,246,.5);border:2px solid rgba(255,255,255,.2)}
.toggle-aqua{position:fixed;bottom:22px;left:90px;z-index:160;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;border:2px solid rgba(255,255,255,.15)}

.chat-input-bar.active{display:flex}
.chat-input-bar input{flex:1;padding:11px 16px;border-radius:22px;border:none;background:rgba(0,0,0,.5);color:#fff;outline:none;font-size:14px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:linear-gradient(160deg,#16213e,#0b0e14);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid #1cb0f6}
.modal-title{color:#1cb0f6;font-size:18px;font-weight:800;text-align:center;margin-bottom:15px}
.achievement{display:flex;gap:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}

#welcome-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#0a0e1a,#141a2e);z-index:99998;display:none;flex-direction:column;justify-content:center;align-items:center;padding:25px;overflow-y:auto}

.welcome-card{background:linear-gradient(160deg,rgba(22,33,62,.9),rgba(15,22,42,.9));border-radius:20px;padding:18px;border:1px solid rgba(28,176,246,.3);text-align:left}

const CURSOS={
python:{nombre:"Python",color:"#58cc02",color2:"#3a8f01",lecciones:PY},
hacking:{nombre:"Hacking",color:"#e94560",color2:"#a82842",lecciones:HK},
termux:{nombre:"Termux",color:"#00d4aa",color2:"#008f70",lecciones:TX}
};

let cursoActual='python';
let progreso={python:0,hacking:0,termux:0};
let xp=0,level=1,streak=0,logros=[],errores=[],energia=100;
let currentUser=null,aquaVisible=true,modoRepaso=false,ultimaRecarga=Date.now();
let welcomePaso=0;
const COSTO_ENERGIA=10,REGEN_MS=180000;

const WELCOME_STEPS=[
{icon:"👋",title:"¡Bienvenido a CodeMaster!",text:"Aprende Python, Hacking Ético y Termux con Aqua, tu compañera diosa."},
{icon:"📚",title:"3 Cursos, 120 Lecciones",text:"Cada curso tiene 40 lecciones detalladas con teoría, ejemplos y quiz al final."},
{icon:"⚡",title:"Energía y Rachas",text:"Ganas 15 XP por lección. Cada lección cuesta 10 de energía, que se regenera 1 cada 3 minutos. ¡Mantén tu racha diaria!"},
{icon:"🏆",title:"Logros y Repaso",text:"Desbloquea logros al avanzar. Si fallas una pregunta, queda en tu lista de repaso para volver a intentarla."},
{icon:"💬",title:"Aqua te acompaña",text:"Arrástrala por la pantalla, ocúltala con 👁️, o chatea con ella pulsando 💬. ¡Ella te responderá con IA!"},
];

function totalCompletadas(){return progreso.python+progreso.hacking+progreso.termux;}

auth.onAuthStateChanged((user)=>{
if(user){
currentUser=user;
document.getElementById('auth-overlay').style.display='none';
document.getElementById('welcome-overlay').classList.remove('active');
document.getElementById('welcome-overlay').style.display='none';
document.getElementById('user-bar').style.display='flex';
document.getElementById('user-email').innerText=user.email;
cargarDatos(user.uid);
}else{
currentUser=null;
document.getElementById('auth-overlay').style.display='flex';
document.getElementById('welcome-overlay').classList.remove('active');
document.getElementById('welcome-overlay').style.display='none';
document.getElementById('user-bar').style.display='none';
}
});

function registrar(){
const email=document.getElementById('email').value.trim();
const pass=document.getElementById('password').value;
const err=document.getElementById('auth-error');
err.innerText='';
if(!email||pass.length<6){err.innerText="Correo válido y contraseña 6+.";return;}
auth.createUserWithEmailAndPassword(email,pass).catch(e=>err.innerText=traducir(e.code));
}
function login(){
const email=document.getElementById('email').value.trim();
const pass=document.getElementById('password').value;
const err=document.getElementById('auth-error');
err.innerText='';
auth.signInWithEmailAndPassword(email,pass).catch(e=>err.innerText=traducir(e.code));
}
function traducir(c){
const m={'auth/email-already-in-use':'Correo ya registrado.','auth/invalid-email':'Correo inválido.','auth/weak-password':'Contraseña débil.','auth/user-not-found':'Usuario no existe.','auth/wrong-password':'Contraseña incorrecta.','auth/invalid-credential':'Datos incorrectos.'};
return m[c]||'Error: '+c;
}
function cerrarSesion(){
if(confirm('¿Cerrar sesión?')){
document.getElementById('welcome-overlay').classList.remove('active');
document.getElementById('welcome-overlay').style.display='none';
auth.signOut();
}
}

async function guardarProgreso(){
if(!currentUser)return;
try{
await db.collection('usuarios').doc(currentUser.uid).set({email:currentUser.email,xp,level,streak,progreso,logros,errores,energia,ultimaRecarga,ultimaActividad:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
}catch(e){console.error(e);}
}

async function cargarDatos(uid){
try{
const doc=await db.collection('usuarios').doc(uid).get();
if(doc.exists){
const d=doc.data();
xp=d.xp||0;level=d.level||1;streak=d.streak||0;energia=d.energia||100;
progreso=d.progreso||{python:0,hacking:0,termux:0};
logros=d.logros||[];errores=d.errores||[];
ultimaRecarga=d.ultimaRecarga||Date.now();
if(d.ultimaActividad){
const last=d.ultimaActividad.toDate();
const hoy=new Date();
const diff=Math.floor((hoy-last)/(1000*60*60*24));
if(diff===1)streak++;
else if(diff>1)streak=1;
}else streak=1;
calcularEnergia();actualizarStats();renderPath();verificarLogros();guardarProgreso();
if(!d.vistoBienvenida){mostrarBienvenida();await db.collection('usuarios').doc(uid).set({vistoBienvenida:true},{merge:true});}
}else{
streak=1;energia=100;ultimaRecarga=Date.now();
await db.collection('usuarios').doc(uid).set({email:currentUser.email,xp:0,level:1,streak:1,energia:100,ultimaRecarga:Date.now(),progreso:{python:0,hacking:0,termux:0},logros:[],errores:[],vistoBienvenida:true});
actualizarStats();renderPath();
mostrarBienvenida();
}
}catch(e){console.error(e);}
}

function mostrarBienvenida(){
welcomePaso=0;
const el=document.getElementById('welcome-overlay');
el.style.display='flex';
el.classList.add('active');
renderWelcome();
}

function renderWelcome(){
const paso=WELCOME_STEPS[welcomePaso];
const card=document.getElementById('welcome-card');
const sub=document.getElementById('welcome-sub');
const prog=document.getElementById('welcome-progress');
sub.innerText = welcomePaso===0 ? "Tu aventura con Aqua comienza ahora" : "";
prog.innerHTML='';
WELCOME_STEPS.forEach((_,i)=>{
const d=document.createElement('div');
d.className='welcome-dot'+(i===welcomePaso?' active':'');
prog.appendChild(d);
});
card.innerHTML=`<div class="welcome-step"><div class="icon">${paso.icon}</div><div class="text"><strong>${paso.title}</strong>${paso.text}</div></div>`;
document.getElementById('welcome-btn').innerText = welcomePaso === WELCOME_STEPS.length-1 ? "¡EMPEZAR! 🚀" : "SIGUIENTE ➤";
}

function welcomeNext(){
if(welcomePaso < WELCOME_STEPS.length-1){
welcomePaso++;
renderWelcome();
} else {
const el=document.getElementById('welcome-overlay');
el.classList.remove('active');
el.style.display='none';
aquaSpeak("¡Bienvenido! Elige un curso y empecemos. 😏",4000);
}
}

function calcularEnergia(){
const ahora=Date.now();
const transcurrido=ahora-ultimaRecarga;
const ganada=Math.floor(transcurrido/REGEN_MS);
if(ganada>0){energia=Math.min(100,energia+ganada);ultimaRecarga=ahora-((transcurrido%REGEN_MS));}
}

function actualizarStats(){
document.getElementById('xp').innerText=xp;
document.getElementById('level').innerText=level;
document.getElementById('streak').innerText=streak+'🔥';
document.getElementById('energy').innerText=energia;
document.getElementById('logros-count').innerText=logros.length;
document.getElementById('errores-count').innerText=errores.length;
}

function verificarLogros(){
LOGROS.forEach(l=>{if(!logros.includes(l.id)&&l.check()){logros.push(l.id);mostrarToast(`🏆 ¡Logro: ${l.name}!`);}});
actualizarStats();
}

function mostrarToast(txt){
const t=document.getElementById('toast');
t.innerText=txt;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),3500);
}

function abrirLogros(){
const list=document.getElementById('logros-list');
list.innerHTML='';
LOGROS.forEach(l=>{
const u=logros.includes(l.id);
list.innerHTML+=`<div class="achievement ${u?'unlocked':'locked'}"><div class="icon">${l.icon}</div><div class="info"><h4>${l.name}</h4><p>${l.desc}</p></div></div>`;
});
document.getElementById('modal-logros').classList.add('active');
}
function cerrarLogros(){document.getElementById('modal-logros').classList.remove('active');}

function repasarErrores(){
if(errores.length===0){aquaSpeak("¡Sin errores pendientes! 😏",3000);return;}
modoRepaso=true;
const e=errores[0];
abrirLeccion(e.idx,e.curso);
}

function renderPath(){
const curso=CURSOS[cursoActual];
const prog=progreso[cursoActual];
const cont=document.getElementById('path-container');
cont.innerHTML='';
curso.lecciones.forEach((l,i)=>{
const n=document.createElement('div');
n.className='node';
n.innerHTML=`<span class="node-num">${i+1}</span><span class="node-mini">${l.t.substring(0,12)}</span>`;
if(i<prog){n.classList.add('completed');n.onclick=()=>abrirLeccion(i,cursoActual);}
else if(i===prog){n.classList.add('active');if(cursoActual==='hacking')n.classList.add('active-hacking');if(cursoActual==='termux')n.classList.add('active-termux');n.onclick=()=>abrirLeccion(i,cursoActual);}
else{n.classList.add('locked');n.innerHTML='🔒';n.onclick=()=>aquaSpeak("¡Bloqueado! 😈",2000);}
cont.appendChild(n);
});
document.getElementById('tab-python').className='course-tab'+(cursoActual==='python'?' active-python':'');
document.getElementById('tab-hacking').className='course-tab'+(cursoActual==='hacking'?' active-hacking':'');
document.getElementById('tab-termux').className='course-tab'+(cursoActual==='termux'?' active-termux':'');
}

function switchCourse(c){cursoActual=c;renderPath();aquaSpeak(`¡${CURSOS[c].nombre}! 😏`,2000);}

function abrirLeccion(idx,curso){
const cursoKey=curso||cursoActual;
const lec=CURSOS[cursoKey].lecciones[idx];
if(!lec)return;
if(!modoRepaso && energia<COSTO_ENERGIA){aquaSpeak("¡Sin energía! Espera, mortal. ⚡",3000);return;}
if(!modoRepaso){energia-=COSTO_ENERGIA;actualizarStats();guardarProgreso();}
document.getElementById('lesson-overlay').classList.add('active');
moverAquaLeccion(true);
document.getElementById('lesson-counter').innerText=`${idx+1}/${CURSOS[cursoKey].lecciones.length}`;
const fill=document.getElementById('lesson-progress-fill');
fill.style.background=`linear-gradient(90deg,${CURSOS[cursoKey].color},${CURSOS[cursoKey].color2})`;
let paso=0;

function mostrarPaso(){
if(paso<lec.p.length){
const p=lec.p[paso];
document.getElementById('lesson-content').innerHTML=`<div class="lesson-card"><div class="lesson-title">📖 ${lec.t}</div><div class="step-title">${p.t}</div><div class="step-text">${p.c}</div><button class="lesson-btn" id="btn-next">SIGUIENTE ➤</button></div>`;
document.getElementById('btn-next').onclick=()=>{paso++;mostrarPaso();};
fill.style.width=((paso+1)/(lec.p.length+1)*100)+'%';
}else mostrarQuiz();
}

function mostrarQuiz(){
let html=`<div class="lesson-card"><div class="lesson-title">🧠 Pon a prueba</div><div class="quiz-question">${lec.q}</div>`;
lec.o.forEach((op,i)=>{html+=`<button class="quiz-option" data-i="${i}">${op}</button>`;});
html+=`</div>`;
document.getElementById('lesson-content').innerHTML=html;
fill.style.width='90%';
document.querySelectorAll('.quiz-option').forEach(b=>{
b.onclick=()=>{
const i=parseInt(b.dataset.i);
document.querySelectorAll('.quiz-option').forEach(x=>x.disabled=true);
if(i===lec.c){
b.classList.add('correct');
fill.style.width='100%';
errores=errores.filter(e=>!(e.idx===idx&&e.curso===cursoKey));
if(!modoRepaso && progreso[cursoKey]===idx)progreso[cursoKey]++;
xp+=15;if(xp>=100){level++;xp-=100;}
verificarLogros();guardarProgreso();actualizarStats();
setTimeout(()=>{cerrarLeccion();renderPath();aquaSpeak("¡Excelente! ✨",2000);modoRepaso=false;},1400);
}else{
b.classList.add('wrong');
document.querySelectorAll('.quiz-option')[lec.c].classList.add('correct');
if(!errores.find(e=>e.idx===idx&&e.curso===cursoKey))errores.push({idx,curso:cursoKey});
guardarProgreso();actualizarStats();
aquaSpeak("¡Ay, no! 😭",2500);
setTimeout(()=>{cerrarLeccion();modoRepaso=false;},2000);
}
};
});
}
mostrarPaso();
}

function cerrarLeccion(){document.getElementById('lesson-overlay').classList.remove('active');moverAquaLeccion(false);}

const aquaBubble=document.getElementById('aqua-bubble');
function aquaSpeak(text,dur=3000){
if(!aquaVisible)return;
aquaBubble.innerText=text;
aquaBubble.classList.add('show');
clearTimeout(window.bT);
window.bT=setTimeout(()=>aquaBubble.classList.remove('show'),dur);
const s=window.speechSynthesis;
const u=new SpeechSynthesisUtterance(text);
u.lang='es-ES';u.rate=1.0;u.pitch=1.4;s.cancel();s.speak(u);
}
function toggleAqua(){
aquaVisible=!aquaVisible;
document.getElementById('canvas3d').style.opacity=aquaVisible?'1':'0';
document.getElementById('aqua-handle').style.display=aquaVisible?'block':'none';
aquaBubble.classList.remove('show');
const t=document.getElementById('toggle-aqua');
t.classList.toggle('off',!aquaVisible);
t.innerText=aquaVisible?'👁️':'🚫';
}

let dragging=false,sX=0,sY=0,sL=0,sT=0;
const aquaHandle=document.getElementById('aqua-handle');
aquaHandle.addEventListener('pointerdown',e=>{dragging=true;const r=aquaHandle.getBoundingClientRect();sX=e.clientX;sY=e.clientY;sL=r.left;sT=r.top;aquaHandle.classList.add('grabbing');e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sX,dy=e.clientY-sY;const newL=Math.max(0,Math.min(window.innerWidth-130,sL+dx));const newT=Math.max(0,Math.min(window.innerHeight-200,sT+dy));aquaHandle.style.left=newL+'px';aquaHandle.style.top=newT+'px';aquaHandle.style.right='auto';aquaHandle.style.bottom='auto';updateAqua3D(newL+65,newT+100);e.preventDefault();});
document.addEventListener('pointerup',()=>{dragging=false;aquaHandle.classList.remove('grabbing');});

function updateAqua3D(px,py){if(!modelo3D)return;const scale=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;modelo3D.position.x=(px-window.innerWidth/2)*scale;modelo3D.position.y=-(py-window.innerHeight/2)*scale+1.0;aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;}

function moverAquaLeccion(activo){
if(!modelo3D)return;
if(activo){
const scale=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;
const px=80,py=window.innerHeight*0.55;
modelo3D.position.x=(px-window.innerWidth/2)*scale;
modelo3D.position.y=-(py-window.innerHeight/2)*scale+1.0;
aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;
modelo3D.scale.set(1.6,1.6,1.6);
}else{
const r=aquaHandle.getBoundingClientRect();
updateAqua3D(r.left+65,r.top+100);
modelo3D.scale.set(1.3,1.3,1.3);
}
}

function toggleChat(){const b=document.getElementById('chat-input-bar');const f=document.getElementById('chat-fab');b.classList.toggle('active');f.classList.toggle('active');f.innerText=b.classList.contains('active')?'✕':'💬';}
function handleChatKey(e){if(e.key==='Enter')sendChat();}
async function sendChat(){
const i=document.getElementById('chat-input');
const t=i.value.trim();
if(!t)return;
i.value='';
aquaSpeak('...',1500);
try{
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:t})});
const d=await r.json();
aquaSpeak(d.respuesta,5000);
}catch(e){aquaSpeak("Error de conexión, mortal.",3000);}
}

const canvas=document.getElementById('canvas3d');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1,8);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0xffffff,.9));
const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(2,5,5);scene.add(dl);
const bl=new THREE.PointLight(0x1cb0f6,2,12);bl.position.set(-2,1,2);scene.add(bl);
const pk=new THREE.PointLight(0xe94560,1,12);pk.position.set(2,0,2);scene.add(pk);

let modelo3D,aquaBaseX=0,aquaBaseY=0;
new THREE.GLTFLoader().load('/static/aqua__anime_chibi_model.glb',g=>{
modelo3D=g.scene;
modelo3D.scale.set(1.3,1.3,1.3);
const r=aquaHandle.getBoundingClientRect();
updateAqua3D(r.left+65,r.top+100);
scene.add(modelo3D);
});

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);if(modelo3D&&!dragging){modelo3D.position.y=aquaBaseY+Math.sin(clock.getElapsedTime()*2)*.05;}renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

setInterval(()=>{calcularEnergia();actualizarStats();},30000);
renderPath();
</script>
