<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeMaster Pro</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0a0e1a;color:#fff;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(28,176,246,.15),transparent 50%),radial-gradient(circle at 80% 90%,rgba(233,69,96,.12),transparent 50%),radial-gradient(circle at 50% 50%,#141a2e,#0a0e1a);z-index:0}
#canvas3d{position:fixed;inset:0;z-index:150;pointer-events:none}
#aqua-handle{position:fixed;width:140px;height:220px;bottom:100px;right:20px;z-index:151;cursor:grab;pointer-events:auto;touch-action:none;border-radius:50%;border:2px dashed transparent}
#aqua-handle.grabbing{border-color:#1cb0f6;background:rgba(28,176,246,.1)}
#aqua-handle::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(28,176,246,.35),transparent 70%);animation:pulseAura 3s infinite ease-in-out;pointer-events:none}
@keyframes pulseAura{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:.8;transform:scale(1.05)}}
#auth-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#0a0e1a,#141a2e);z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:25px}
#auth-overlay h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
#auth-overlay p.sub{color:#8b95a5;font-size:13px;margin-bottom:10px}
#auth-overlay input{width:100%;max-width:320px;padding:14px;border-radius:12px;border:2px solid #2a3a52;background:#0b0e14;color:#fff;outline:none;font-size:14px}
#auth-overlay input:focus{border-color:#1cb0f6}
#btn-login{width:100%;max-width:320px;padding:15px;border-radius:12px;border:none;background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;font-weight:800;font-size:15px;cursor:pointer;border-bottom:4px solid #0a6ea8}
#btn-register{width:100%;max-width:320px;padding:15px;border-radius:12px;border:2px solid #1cb0f6;background:transparent;color:#1cb0f6;font-weight:800;font-size:15px;cursor:pointer}
#auth-error{color:#e94560;font-size:13px;text-align:center;max-width:320px;min-height:20px}
.user-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,14,26,.95);backdrop-filter:blur(15px);border-bottom:1px solid rgba(28,176,246,.3);padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.user-bar .email{font-size:11px;color:#8b95a5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%;display:flex;align-items:center;gap:6px}
.user-bar .email::before{content:'👤';font-size:14px}
.user-bar .right-side{display:flex;gap:6px;align-items:center}
.vip-badge{background:linear-gradient(135deg,#f39c12,#c87f0a);color:#fff;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:800}
.logout-btn{background:linear-gradient(135deg,#e94560,#a82842);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer}
.main-content{position:fixed;top:52px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px 15px 220px;z-index:5;display:block}
.course-tabs{display:flex;width:100%;max-width:520px;margin:0 auto 12px;gap:6px;background:rgba(22,33,62,.6);padding:6px;border-radius:16px;border:1px solid rgba(255,255,255,.06);overflow-x:auto}
.course-tab{flex:1;min-width:70px;padding:10px 4px;border-radius:12px;border:none;background:transparent;color:#8b95a5;font-weight:600;cursor:pointer;text-align:center;font-size:10px;white-space:nowrap}
.course-tab.active-python{background:linear-gradient(135deg,#58cc02,#46a302);color:#fff}
.course-tab.active-hacking{background:linear-gradient(135deg,#e94560,#c92a44);color:#fff}
.course-tab.active-termux{background:linear-gradient(135deg,#00d4aa,#00a88a);color:#fff}
.course-tab.active-kali{background:linear-gradient(135deg,#7b4dff,#5a2bd6);color:#fff}
.stats{width:100%;max-width:520px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stat-card{background:rgba(22,33,62,.7);padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.08);text-align:center;cursor:pointer}
.stat-label{font-size:7px;color:#8b95a5;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
.stat-value{font-size:15px;font-weight:800;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.streak{background:linear-gradient(135deg,#ff6b35,#ff9a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-value.energy{background:linear-gradient(135deg,#f39c12,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-value.energy-inf{background:linear-gradient(135deg,#f39c12,#ffd700,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s infinite}
@keyframes shine{0%,100%{opacity:1}50%{opacity:.7}}
.action-buttons{width:100%;max-width:520px;margin:0 auto 12px;display:flex;gap:6px;flex-wrap:wrap}
.action-btn{flex:1;min-width:75px;padding:10px 6px;border-radius:12px;border:none;font-weight:800;font-size:10px;cursor:pointer}
.btn-review{background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff}
.btn-energy{background:linear-gradient(135deg,#00d4aa,#008f70);color:#fff}
.btn-vip{background:linear-gradient(135deg,#f39c12,#c87f0a,#f39c12);color:#fff;background-size:200% 100%;animation:shine 3s infinite}
.btn-waifus{background:linear-gradient(135deg,#e94560,#a82842);color:#fff}
.path-container{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:10px;width:100%;max-width:400px;margin-left:auto;margin-right:auto}
.node{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:16px;font-weight:800;cursor:pointer;position:relative;transition:all .25s;border:3px solid rgba(255,255,255,.08);flex-shrink:0}
.node:nth-child(odd){transform:translateX(-50px)}
.node:nth-child(even){transform:translateX(50px)}
.node.completed{background:linear-gradient(135deg,#e94560,#a82842);color:#fff;box-shadow:0 8px 0 #5f1725}
.node.active{background:linear-gradient(135deg,#58cc02,#3a8f01);color:#fff;box-shadow:0 8px 0 #1f5201,0 0 30px rgba(88,204,2,.7);animation:bobbleOdd 1.8s infinite}
.node.active-hacking{background:linear-gradient(135deg,#e94560,#a82842);box-shadow:0 8px 0 #5f1725}
.node.active-termux{background:linear-gradient(135deg,#00d4aa,#008f70);box-shadow:0 8px 0 #004d3c}
.node.active-kali{background:linear-gradient(135deg,#7b4dff,#5a2bd6);box-shadow:0 8px 0 #3a1a99}
.node.locked{background:linear-gradient(135deg,#1e2841,#131c2e);color:#4a5668;cursor:not-allowed}
.node .node-num{font-size:16px;line-height:1}
.node .node-mini{font-size:6px;opacity:.75;margin-top:2px;font-weight:600;text-align:center;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
@keyframes bobbleOdd{0%,100%{transform:scale(1) translateX(-50px)}50%{transform:scale(1.07) translateX(-50px)}}
#aqua-bubble{position:fixed;bottom:55%;right:15px;width:230px;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;padding:15px 18px;border-radius:20px;font-size:13px;font-weight:600;line-height:1.45;z-index:160;box-shadow:0 10px 30px rgba(28,176,246,.45);opacity:0;transform:translateY(15px);transition:all .35s;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
#aqua-bubble.show{opacity:1;transform:translateY(0)}
.lesson-overlay{position:fixed;inset:0;background:linear-gradient(160deg,rgba(10,14,26,.92),rgba(15,22,42,.92));backdrop-filter:blur(10px);z-index:100;display:none;flex-direction:column;padding:60px 15px 15px;box-sizing:border-box;overflow-y:auto}
.lesson-overlay.active{display:flex}
.lesson-top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px;max-width:640px;margin-left:auto;margin-right:auto;width:100%}
.close-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;font-weight:bold;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lesson-progress-bg{flex:1;height:14px;background:rgba(0,0,0,.4);border-radius:10px;overflow:hidden}
.lesson-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#58cc02,#89e219);border-radius:10px;transition:width .5s}
.lesson-counter{color:#8b95a5;font-size:11px;font-weight:700;min-width:65px;text-align:right}
.lesson-content{flex:1;display:flex;flex-direction:column;gap:15px;width:100%;max-width:640px;margin:0 auto;padding-bottom:200px;padding-left:100px}
.lesson-card{background:linear-gradient(160deg,rgba(22,33,62,.96),rgba(15,22,42,.96));border-radius:22px;padding:18px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.lesson-title{color:#1cb0f6;font-size:13px;font-weight:800;text-align:center;letter-spacing:1px;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid rgba(28,176,246,.2);margin-bottom:12px}
.step-title{color:#58cc02;font-size:13px;font-weight:800;margin-bottom:8px;padding-left:8px;border-left:3px solid #58cc02}
.step-text{color:#c8d1de;font-size:13px;line-height:1.7;margin-bottom:12px}
.step-text code{background:rgba(0,0,0,.5);color:#58cc02;padding:2px 6px;border-radius:5px;font-family:'Courier New',monospace;font-size:11.5px}
.step-text pre{background:#050810;color:#89e219;padding:11px;border-radius:10px;font-family:'Courier New',monospace;font-size:11px;overflow-x:auto;margin:8px 0;border-left:3px solid #58cc02;line-height:1.5}
.lesson-btn{background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;border:none;border-bottom:5px solid #0a6ea8;padding:13px;border-radius:14px;font-size:13px;font-weight:800;cursor:pointer;width:100%;text-transform:uppercase;margin-top:10px}
.lesson-btn:active{transform:translateY(3px);border-bottom-width:2px}
.quiz-question{color:#fff;font-size:14px;font-weight:700;line-height:1.5;margin-bottom:12px}
.quiz-option{background:rgba(30,42,50,.9);color:#fff;border:2px solid #37464f;padding:12px;border-radius:12px;text-align:left;cursor:pointer;margin-bottom:8px;font-size:13px;font-weight:600;width:100%}
.quiz-option.correct{background:linear-gradient(135deg,#4e9f3d,#3a8f01);border-color:#58cc02}
.quiz-option.wrong{background:linear-gradient(135deg,#d32f2f,#a82842);border-color:#e94560}
.quiz-option:disabled{cursor:not-allowed}
.chat-fab{position:fixed;bottom:22px;left:22px;z-index:160;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(28,176,246,.5);border:2px solid rgba(255,255,255,.2)}
.toggle-aqua{position:fixed;bottom:22px;left:90px;z-index:160;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#533483,#3a1e5c);color:#fff;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;border:2px solid rgba(255,255,255,.15)}
.toggle-aqua.off{background:linear-gradient(135deg,#37464f,#1e2a32);opacity:.6}
.chat-input-bar{position:fixed;bottom:90px;left:22px;right:22px;z-index:160;display:none;gap:8px;align-items:center;background:linear-gradient(160deg,rgba(22,33,62,.98),rgba(15,22,42,.98));padding:10px;border-radius:28px;border:2px solid #1cb0f6}
.chat-input-bar.active{display:flex}
.chat-input-bar input{flex:1;padding:11px 16px;border-radius:22px;border:none;background:rgba(0,0,0,.5);color:#fff;outline:none;font-size:14px}
.chat-input-bar button{background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;border:none;border-radius:50%;width:42px;height:42px;display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:linear-gradient(160deg,#16213e,#0b0e14);border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid #1cb0f6}
.modal-content.vip-modal{border:2px solid #f39c12;box-shadow:0 0 40px rgba(243,156,18,.5)}
.modal-title{color:#1cb0f6;font-size:18px;font-weight:800;text-align:center;margin-bottom:15px}
.modal-title.gold{background:linear-gradient(135deg,#f39c12,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:22px}
.vip-benefit{display:flex;gap:12px;padding:14px;background:linear-gradient(135deg,rgba(243,156,18,.15),rgba(200,127,10,.05));border-radius:14px;margin-bottom:10px;border:1px solid rgba(243,156,18,.4)}
.vip-benefit .icon{font-size:32px;flex-shrink:0}
.vip-benefit h4{color:#f39c12;font-size:14px;font-weight:800;margin-bottom:4px}
.vip-benefit p{color:#c8d1de;font-size:12px;line-height:1.4}
.waifu-card{display:flex;gap:12px;padding:12px;background:rgba(0,0,0,.3);border-radius:14px;margin-bottom:10px;border:2px solid transparent;cursor:pointer}
.waifu-card.selected{border-color:#1cb0f6;background:rgba(28,176,246,.15)}
.waifu-card .avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);overflow:hidden;flex-shrink:0}
.waifu-card .avatar img{width:100%;height:100%;object-fit:cover}
.waifu-card .info{flex:1}
.waifu-card h4{color:#fff;font-size:14px;margin-bottom:4px}
.waifu-card p{color:#8b95a5;font-size:11px}
.waifu-card .check{color:#1cb0f6;font-size:20px;align-self:center}
.size-control{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);padding:12px;border-radius:14px;margin:10px 0}
.size-control button{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#1cb0f6,#0d7bc4);color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
.size-control input[type=range]{flex:1}
.size-control .val{color:#1cb0f6;font-weight:800;min-width:45px;text-align:center}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-150px);background:linear-gradient(135deg,#f39c12,#c87f0a);color:#fff;padding:14px 22px;border-radius:15px;font-weight:800;font-size:14px;z-index:1000;transition:transform .4s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#welcome-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#0a0e1a,#141a2e);z-index:99998;display:none;flex-direction:column;justify-content:center;align-items:center;padding:25px;overflow-y:auto}
#welcome-overlay.active{display:flex}
.welcome-container{max-width:400px;width:100%;display:flex;flex-direction:column;gap:20px;text-align:center}
.welcome-logo{font-size:42px;font-weight:900;background:linear-gradient(135deg,#1cb0f6,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
.welcome-card{background:linear-gradient(160deg,rgba(22,33,62,.9),rgba(15,22,42,.9));border-radius:20px;padding:18px;border:1px solid rgba(28,176,246,.3);text-align:left}
.welcome-step{display:flex;gap:12px;padding:10px 0}
.welcome-step .icon{font-size:26px;flex-shrink:0}
.welcome-step .text{color:#c8d1de;font-size:13px;line-height:1.5}
.welcome-step .text strong{color:#1cb0f6;display:block;margin-bottom:2px}
.welcome-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(180deg,#1cb0f6,#0d8ddb);color:#fff;font-weight:800;font-size:16px;cursor:pointer;border-bottom:5px solid #0a6ea8;text-transform:uppercase;margin-top:10px}
.welcome-progress{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.welcome-dot{width:10px;height:10px;border-radius:50%;background:#2a3a52;transition:all .3s}
.welcome-dot.active{background:#1cb0f6;width:28px;border-radius:5px}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="aqua-handle"></div>

<div id="welcome-overlay" style="display:none"><div class="welcome-container"><div class="welcome-progress" id="welcome-progress"></div><div class="welcome-logo">CodeMaster</div><p class="welcome-sub" id="welcome-sub">Tu aventura comienza</p><div class="welcome-card" id="welcome-card"></div><button class="welcome-btn" onclick="welcomeNext()">SIGUIENTE ➤</button></div></div>

<div id="auth-overlay">
<h1>CodeMaster</h1>
<p class="sub">Aprende con tus waifus</p>
<input id="email" type="email" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña (6+)">
<button id="btn-login" onclick="login()">INICIAR SESIÓN</button>
<button id="btn-register" onclick="registrar()">CREAR CUENTA</button>
<p id="auth-error"></p>
</div>

<div class="user-bar" id="user-bar" style="display:none">
<span class="email" id="user-email">...</span>
<div class="right-side">
<span class="vip-badge" id="vip-badge" style="display:none">⭐ VIP</span>
<button class="logout-btn" onclick="cerrarSesion()">SALIR</button>
</div>
</div>

<div class="lesson-overlay" id="lesson-overlay">
<div class="lesson-top-bar">
<button class="close-btn" onclick="closeLesson()">✕</button>
<div class="lesson-progress-bg"><div class="lesson-progress-fill" id="lesson-progress-fill"></div></div>
<div class="lesson-counter" id="lesson-counter">0/300</div>
</div>
<div class="lesson-content" id="lesson-content"></div>
</div>

<div class="modal" id="modal-vip"><div class="modal-content vip-modal"><div class="modal-title gold">⭐ VIP</div><div id="vip-benefits-list"></div><div id="vip-status-area" style="margin-top:15px;text-align:center"></div><button class="lesson-btn" onclick="cerrarVip()" style="margin-top:15px">CERRAR</button></div></div>

<div class="modal" id="modal-waifus"><div class="modal-content"><div class="modal-title">👥 Elige tu Waifu</div><div id="waifus-list"></div><div class="size-control"><button onclick="cambiarTamano(-0.1)">−</button><input type="range" id="size-slider" min="1" max="5" step="0.1" value="2.5" oninput="cambiarTamano(this.value,true)"><button onclick="cambiarTamano(0.1)">＋</button><span class="val" id="size-val">2.5x</span></div><button class="lesson-btn" onclick="cerrarWaifus()" style="margin-top:10px">CERRAR</button></div></div>

<div class="main-content" id="main-content">
<div class="course-tabs">
<button class="course-tab active-python" id="tab-python" onclick="switchCourse('python')">🐍 Python</button>
<button class="course-tab" id="tab-hacking" onclick="switchCourse('hacking')">🛡️ Hacking</button>
<button class="course-tab" id="tab-termux" onclick="switchCourse('termux')">💻 Termux</button>
<button class="course-tab" id="tab-kali" onclick="switchCourse('kali')">🐉 Kali</button>
</div>
<div class="stats">
<div class="stat-card"><div class="stat-label">Nivel</div><div class="stat-value" id="level">1</div></div>
<div class="stat-card"><div class="stat-label">XP</div><div class="stat-value" id="xp">0</div></div>
<div class="stat-card"><div class="stat-label">Racha</div><div class="stat-value streak" id="streak">0🔥</div></div>
<div class="stat-card" onclick="conseguirEnergia()"><div class="stat-label">Energía</div><div class="stat-value energy" id="energy">100</div></div>
<div class="stat-card"><div class="stat-label">Lecc.</div><div class="stat-value" id="logros-count">0</div></div>
</div>
<div class="action-buttons">
<button class="action-btn btn-review" onclick="repasarErrores()">🔁 Repasar (<span id="errores-count">0</span>)</button>
<button class="action-btn btn-energy" id="btn-energy" onclick="conseguirEnergia()">⚡ Ener</button>
<button class="action-btn btn-waifus" onclick="abrirWaifus()">👥 Waifus</button>
<button class="action-btn btn-vip" onclick="abrirVip()">⭐ VIP</button>
</div>
<div class="path-container" id="path-container"></div>
</div>

<div id="aqua-bubble"></div>
<div class="toast" id="toast"></div>

t:titulo,

}

async function cargarDatos(uid){
try{
const doc=await db.collection('usuarios').doc(uid).get();

}else{
streak=1;energia=isVip?99999:100;ultimaRecarga=Date.now();

}
}catch(e){console.error(e);}
}

n.className='node';n.innerHTML=`<span class="node-num">${i+1}</span><span class="node-mini">${l.t.substring(0,10)}</span>`;
if(i<p){n.classList.add('completed');n.onclick=()=>abrirLeccion(i,cursoActual);}
else if(i===p){n.classList.add('active');n.classList.add(c.clase);n.onclick=()=>abrirLeccion(i,cursoActual);}
else{n.classList.add('locked');n.innerHTML='🔒';n.onclick=()=>aquaSpeak("¡Bloqueado! 😈",2000);}
cont.appendChild(n);
}
document.getElementById('tab-python').className='course-tab'+(cursoActual==='python'?' active-python':'');
document.getElementById('tab-hacking').className='course-tab'+(cursoActual==='hacking'?' active-hacking':'');
document.getElementById('tab-termux').className='course-tab'+(cursoActual==='termux'?' active-termux':'');
document.getElementById('tab-kali').className='course-tab'+(cursoActual==='kali'?' active-kali':'');
}
function switchCourse(c){cursoActual=c;renderPath();aquaSpeak(`¡${CURSOS[c].nombre}! 😏`,2000);}

// LECCIONES
let preguntasActuales=[],pregIdx=0,respuestasCorrectas=0;
function abrirLeccion(idx,curso){
const key=curso||cursoActual;const lec=CURSOS[key].lecciones[idx];if(!lec)return;
if(!modoRepaso && !isVip && energia<COSTO_ENERGIA){aquaSpeak("¡Sin energía! ⚡",3000);return;}
if(!modoRepaso && !isVip){energia-=COSTO_ENERGIA;actualizarStats();guardarProgreso();}
document.getElementById('lesson-overlay').classList.add('active');
moverWaifuLeccion(true);
document.getElementById('lesson-counter').innerText=`${idx+1}/${CURSOS[key].lecciones.length}`;
const fill=document.getElementById('lesson-progress-fill');
fill.style.background=`linear-gradient(90deg,${CURSOS[key].color},${CURSOS[key].color2})`;
let paso=0;respuestasCorrectas=0;
preguntasActuales=lec.q||[];pregIdx=0;
function mostrarPaso(){
if(paso<lec.p.length){
const pp=lec.p[paso];
document.getElementById('lesson-content').innerHTML=`<div class="lesson-card"><div class="lesson-title">📖 ${lec.t}</div><div class="step-title">${pp.t}</div><div class="step-text">${pp.c}</div><button class="lesson-btn" id="btn-next">SIGUIENTE ➤</button></div>`;
document.getElementById('btn-next').onclick=()=>{paso++;mostrarPaso();};
fill.style.width=((paso+1)/(lec.p.length+preguntasActuales.length)*100)+'%';
}else mostrarQuiz();
}
function mostrarQuiz(){
if(pregIdx>=preguntasActuales.length){
fill.style.width='100%';
const ac=respuestasCorrectas,tot=preguntasActuales.length;
if(ac===tot){
errores=errores.filter(e=>!(e.idx===idx&&e.curso===key));
if(!modoRepaso && progreso[key]===idx)progreso[key]++;
xp+=15;if(xp>=100){level++;xp-=100;}
guardarProgreso();actualizarStats();
aquaSpeak("¡Excelente! ✨",2000);
setTimeout(()=>{cerrarLeccion();renderPath();modoRepaso=false;},1400);
}else{
if(!errores.find(e=>e.idx===idx&&e.curso===key))errores.push({idx,curso:key});
guardarProgreso();actualizarStats();
aquaSpeak(`Acertaste ${ac}/${tot}. 😭`,2500);
setTimeout(()=>{cerrarLeccion();modoRepaso=false;},2000);
}
return;
}
const q=preguntasActuales[pregIdx];
let html=`<div class="lesson-card"><div class="lesson-title">🧠 Pregunta ${pregIdx+1}/${preguntasActuales.length}</div><div class="quiz-question">${q.q}</div>`;
q.o.forEach((op,i)=>{html+=`<button class="quiz-option" data-i="${i}">${op}</button>`;});
html+=`</div>`;
document.getElementById('lesson-content').innerHTML=html;
fill.style.width=((lec.p.length+pregIdx+1)/(lec.p.length+preguntasActuales.length)*100)+'%';
document.querySelectorAll('.quiz-option').forEach(b=>{
b.onclick=()=>{
const i=parseInt(b.dataset.i);
document.querySelectorAll('.quiz-option').forEach(x=>x.disabled=true);
if(i===q.c){b.classList.add('correct');respuestasCorrectas++;}
else{b.classList.add('wrong');document.querySelectorAll('.quiz-option')[q.c].classList.add('correct');}
setTimeout(()=>{pregIdx++;mostrarQuiz();},1200);
};
});
}
mostrarPaso();
}
function cerrarLeccion(){document.getElementById('lesson-overlay').classList.remove('active');moverWaifuLeccion(false);}

// AQUA / TTS
const aquaBubble=document.getElementById('aqua-bubble');
let currentAudio=null;
async function aquaSpeak(text,dur=4000){
if(!aquaVisible)return;
aquaBubble.innerText=text;aquaBubble.classList.add('show');
clearTimeout(window.bT);window.bT=setTimeout(()=>aquaBubble.classList.remove('show'),dur);
if(currentAudio){currentAudio.pause();currentAudio=null;}
try{
console.log('TTS request → voice:',currentWaifu.voice,'text:',text.substring(0,30));
const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:text,voice_id:currentWaifu.voice})});
console.log('TTS response status:',r.status);
if(!r.ok){
const errTxt=await r.text();
console.error('TTS error:',r.status,errTxt);
return;
}
const blob=await r.blob();
const url=URL.createObjectURL(blob);
currentAudio=new Audio(url);
await currentAudio.play();
currentAudio.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;};
}catch(e){console.error('TTS excepción:',e);}
}
// Función de prueba manual
window.testTTS=async function(){
console.log('Probando TTS manual...');
await aquaSpeak('Hola, soy tu waifu favorita. Bienvenido a CodeMaster.',4000);
};

function toggleAqua(){aquaVisible=!aquaVisible;document.getElementById('canvas3d').style.opacity=aquaVisible?'1':'0';document.getElementById('aqua-handle').style.display=aquaVisible?'block':'none';aquaBubble.classList.remove('show');const t=document.getElementById('toggle-aqua');t.classList.toggle('off',!aquaVisible);t.innerText=aquaVisible?'👁️':'🚫';}

let dragging=false,sX=0,sY=0,sL=0,sT=0;
const aquaHandle=document.getElementById('aqua-handle');
aquaHandle.addEventListener('pointerdown',e=>{dragging=true;const r=aquaHandle.getBoundingClientRect();sX=e.clientX;sY=e.clientY;sL=r.left;sT=r.top;aquaHandle.classList.add('grabbing');e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-sX,dy=e.clientY-sY;const nL=Math.max(0,Math.min(window.innerWidth-140,sL+dx));const nT=Math.max(0,Math.min(window.innerHeight-220,sT+dy));aquaHandle.style.left=nL+'px';aquaHandle.style.top=nT+'px';aquaHandle.style.right='auto';aquaHandle.style.bottom='auto';updateWaifu3D(nL+70,nT+110);e.preventDefault();});
document.addEventListener('pointerup',()=>{dragging=false;aquaHandle.classList.remove('grabbing');});
function updateWaifu3D(px,py){if(!modelo3D)return;const sc=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;modelo3D.position.x=(px-window.innerWidth/2)*sc;modelo3D.position.y=-(py-window.innerHeight/2)*sc+1.0;aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;}
function moverWaifuLeccion(a){if(!modelo3D)return;if(a){const sc=(8*Math.tan(Math.PI/8)*2)/window.innerHeight;const px=80,py=window.innerHeight*0.55;modelo3D.position.x=(px-window.innerWidth/2)*sc;modelo3D.position.y=-(py-window.innerHeight/2)*sc+1.0;aquaBaseX=modelo3D.position.x;aquaBaseY=modelo3D.position.y;}else{const r=aquaHandle.getBoundingClientRect();updateWaifu3D(r.left+70,r.top+110);}}

function toggleChat(){const b=document.getElementById('chat-input-bar');const f=document.querySelector('.chat-fab');b.classList.toggle('active');f.classList.toggle('active');f.innerText=b.classList.contains('active')?'✕':'💬';}
function handleChatKey(e){if(e.key==='Enter')sendChat();}
async function sendChat(){const i=document.getElementById('chat-input');const t=i.value.trim();if(!t)return;i.value='';aquaSpeak('...',1500);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje:t,waifu:currentWaifu.name})});const d=await r.json();aquaSpeak(d.respuesta,5000);}catch(e){aquaSpeak("Error de conexión.",3000);}}

// THREE
const canvas=document.getElementById('canvas3d');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1,8);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
let modelo3D,aquaBaseX=0,aquaBaseY=0;

function cargarWaifu(w){
if(modelo3D){scene.remove(modelo3D);if(modelo3D.geometry)modelo3D.geometry.dispose();if(modelo3D.material){if(modelo3D.material.map)modelo3D.material.map.dispose();modelo3D.material.dispose();}modelo3D=null;}
const texLoader=new THREE.TextureLoader();
texLoader.load(w.model,texture=>{
texture.minFilter=THREE.LinearFilter;
const aspect=texture.image.width/texture.image.height;
const height=3;
const width=height*aspect;
const geometry=new THREE.PlaneGeometry(width,height);
const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide});
modelo3D=new THREE.Mesh(geometry,material);
modelo3D.scale.set(waifuSize,waifuSize,1);
const r=aquaHandle.getBoundingClientRect();
updateWaifu3D(r.left+70,r.top+110);
scene.add(modelo3D);
},undefined,e=>console.error('Error PNG:',e));
}

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);if(modelo3D&&!dragging){modelo3D.position.y=aquaBaseY+Math.sin(clock.getElapsedTime()*2)*0.05;modelo3D.rotation.y=Math.sin(clock.getElapsedTime()*0.5)*0.1;}renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

// BIENVENIDA
function mostrarBienvenida(){welcomePaso=0;const el=document.getElementById('welcome-overlay');el.style.display='flex';el.classList.add('active');renderWelcome();}
function renderWelcome(){const p=WELCOME_STEPS[welcomePaso];const c=document.getElementById('welcome-card');const pr=document.getElementById('welcome-progress');document.getElementById('welcome-sub').innerText=welcomePaso===0?"Tu aventura comienza":"";pr.innerHTML='';WELCOME_STEPS.forEach((_,i)=>{const d=document.createElement('div');d.className='welcome-dot'+(i===welcomePaso?' active':'');pr.appendChild(d);});c.innerHTML=`<div class="welcome-step"><div class="icon">${p.icon}</div><div class="text"><strong>${p.title}</strong>${p.text}</div></div>`;document.querySelector('.welcome-btn').innerText=welcomePaso===WELCOME_STEPS.length-1?"¡EMPEZAR! 🚀":"SIGUIENTE ➤";}
function welcomeNext(){if(welcomePaso<WELCOME_STEPS.length-1){welcomePaso++;renderWelcome();}else{const el=document.getElementById('welcome-overlay');el.classList.remove('active');el.style.display='none';aquaSpeak("¡Bienvenido! 😏",4000);}}

setInterval(()=>{calcularEnergia();actualizarStats();},30000);
renderPath();
actualizarBotonEnergia();
</script>
